# 고칠 때마다 통의 계산을 R과 비교하고 경계 상황을 확인 (tests/README.md)
# 확인적 요인분석은 브라우저 속 R(웹알)의 lavaan과 진짜 R의 lavaan을 비교 (REQUIRE_WEBR=1: 건너뛰면 실패)
name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REQUIRE_WEBR: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install lavaan (native R)
        run: Rscript -e 'install.packages(c("lavaan", "jsonlite"))'
      - name: Install Playwright
        working-directory: tests
        run: npm install && npx playwright install --with-deps chromium
      - name: Reference tests (R)
        working-directory: tests
        run: node reference.mjs
      - name: Edge-case tests
        working-directory: tests
        run: node edge.mjs
