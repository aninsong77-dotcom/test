# 웹알 시험: 브라우저 속 R(webR)에서 lavaan이 돌고, 진짜 R의 lavaan과 같은 숫자가 나오는지
name: webr-probe
on:
  push:
    paths: ['tests/webr/**', '.github/workflows/webr-probe.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install lavaan (native R)
        run: Rscript -e 'install.packages(c("lavaan", "jsonlite"))'
      - name: Native R reference
        run: Rscript tests/webr/reference.R
      - name: Install Playwright
        working-directory: tests
        run: npm install && npx playwright install --with-deps chromium
      - name: webR in the browser vs native R
        working-directory: tests
        run: node webr/probe.mjs
