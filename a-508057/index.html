<style>
/* 화면 전체가 깊은 바닷속. 글자와 버튼은 잠수정 계기판처럼 가장자리에 떠 있음 */
:root{
  --void:#03101c;
  --ink:#e3f1f7;
  --muted:#86a3b3;
  --glow:#8fe3ff;
  --glow-soft:rgba(143,227,255,.14);
  --glass:rgba(227,241,247,.06);
  --line:rgba(227,241,247,.16);
  --f-display:"Nanum Myeongjo","AppleMyungjo","Batang",serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;overflow:hidden;background:var(--void);color:var(--ink);
  font-family:var(--f-body);font-size:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;
  word-break:keep-all;
  -webkit-user-select:none;user-select:none;
}
#world{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}

.fade{transition:opacity .9s ease}
.is-hidden{opacity:0;pointer-events:none!important}
.is-hidden *{pointer-events:none!important}

button{
  font:500 13px/1 var(--f-body);color:var(--ink);
  background:var(--glass);border:1px solid var(--line);border-radius:999px;
  padding:10px 15px;cursor:pointer;white-space:nowrap;flex-shrink:0;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}
button:hover{border-color:rgba(227,241,247,.32)}
button:focus-visible{outline:2px solid var(--glow);outline-offset:2px}

.hud{
  position:fixed;left:0;right:0;top:0;z-index:5;
  padding-top:calc(env(safe-area-inset-top,0px) + 14px);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  pointer-events:none;
}
.hud > *{pointer-events:auto}
.plate{display:grid;gap:5px;min-width:0}
.plate .id{font:500 15px/1 var(--f-mono);letter-spacing:.2em}
.plate .sub{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.plate .hint{font-size:12px;color:var(--muted);opacity:.8;max-width:32em;line-height:1.5}

.star-btn{
  position:fixed;z-index:5;
  right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));
  bottom:calc(env(safe-area-inset-bottom,0px) + 22px);
  padding:13px 18px;border-color:rgba(143,227,255,.45);background:var(--glow-soft);color:var(--glow);
}

.stick{
  display:none;position:fixed;z-index:5;
  left:max(20px,calc(env(safe-area-inset-left,0px) + 20px));
  bottom:calc(env(safe-area-inset-bottom,0px) + 20px);
  width:116px;height:116px;border-radius:50%;
  border:1px solid var(--line);background:var(--glass);touch-action:none;
}
.stick .knob{
  position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;
  border-radius:50%;background:rgba(143,227,255,.3);border:1px solid rgba(143,227,255,.55);
}
@media (pointer:coarse){.stick{display:block}}

.toast{
  position:fixed;z-index:5;left:50%;transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom,0px) + 214px);
  font-size:13px;color:var(--ink);background:var(--glass);border:1px solid var(--line);
  border-radius:999px;padding:9px 16px;white-space:nowrap;
}

.intro{position:fixed;inset:0;z-index:6;display:grid;place-items:center;pointer-events:none;text-align:center}
.intro p{
  margin:0;padding:0 16px;font:400 clamp(19px,4.6vw,28px)/1.5 var(--f-display);
  letter-spacing:.03em;color:var(--ink);text-wrap:balance;transition:opacity .7s ease;
  text-shadow:0 1px 14px rgba(0,20,40,.55);
}
.intro .depth{
  position:fixed;left:50%;transform:translateX(-50%);
  top:calc(env(safe-area-inset-top,0px) + 22px);
  display:grid;gap:4px;justify-items:center;
  font:500 13px/1 var(--f-mono);color:var(--ink);letter-spacing:.12em;
  text-shadow:0 1px 10px rgba(0,20,40,.6);font-variant-numeric:tabular-nums;
}
.intro .depth b{font:500 clamp(22px,5vw,30px)/1 var(--f-mono);letter-spacing:.06em}
.intro .depth span{font-size:11px;color:var(--muted);letter-spacing:.3em;padding-left:.3em}
.intro .skip{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom,0px) + 26px);pointer-events:auto;
}

.title-card{position:fixed;inset:0;z-index:6;display:grid;place-content:center;gap:12px;text-align:center;pointer-events:none}
.title-card .t-label{font:400 15px/1 var(--f-display);color:var(--muted);letter-spacing:.4em;padding-left:.4em}
.title-card .t-id{font:500 clamp(34px,9vw,66px)/1 var(--f-mono);letter-spacing:.22em;padding-left:.22em;color:var(--ink)}

.notice{position:fixed;inset:0;z-index:7;display:grid;place-items:center;text-align:center;padding:0 24px;color:var(--muted);line-height:1.7}
.enter-btn{
  position:fixed;z-index:5;left:50%;transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom,0px) + 26px);
  padding:13px 20px;border-color:rgba(143,227,255,.5);background:var(--glow-soft);color:var(--glow);
}

.curtain{position:fixed;inset:0;z-index:8;background:var(--void);opacity:0;pointer-events:none;transition:opacity .45s ease}

.room-ui{position:fixed;inset:0;z-index:5;pointer-events:none}
.room-ui > *{pointer-events:auto}
.room-top{
  position:absolute;left:0;right:0;top:0;
  padding-top:calc(env(safe-area-inset-top,0px) + 14px);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;
}
.room-top > *{pointer-events:auto}
.view-btns{display:flex;gap:8px;align-items:center}
.round{width:42px;height:42px;padding:0;font-size:18px;display:grid;place-items:center}
.room-panel{
  position:absolute;left:0;right:0;bottom:0;
  padding-top:12px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid;gap:10px;
  background:rgba(8,7,16,.86);border-top:1px solid var(--line);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
}
.sel-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sel-bar .sel-name{font:700 16px/1.2 var(--f-display);margin-right:auto;min-width:0}
.sel-bar .danger{color:#ffb4a8;border-color:rgba(255,180,168,.35)}
.tabs{display:flex;gap:6px}
.tabs button[aria-selected="true"]{background:var(--glow-soft);color:var(--glow);border-color:rgba(143,227,255,.45)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;min-width:0}
.chips button{padding:10px 14px}
.swatch-row{display:flex;gap:10px;align-items:center;overflow-x:auto;padding:2px 2px 4px;min-width:0}
.swatch-row .lbl{width:2.6em;flex-shrink:0;font-size:12px;color:var(--muted)}
.swatch{width:34px;height:34px;padding:0;border-radius:50%;border:2px solid var(--line);flex-shrink:0}
.swatch[aria-pressed="true"]{border-color:var(--glow);box-shadow:0 0 0 3px rgba(143,227,255,.25)}
.room-hint{margin:0;font-size:12px;color:var(--muted);line-height:1.5}
@media (pointer:coarse){.enter-btn{bottom:calc(env(safe-area-inset-bottom,0px) + 156px)}}


@media (prefers-reduced-motion:reduce){.fade,.intro p,.curtain{transition:none}}
</style>

<script>
// 3D 도구를 불러오지 못했을 때 안내
setTimeout(function(){
  if(!window.__a508ok){

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const $ = id => document.getElementById(id);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const coarse = matchMedia('(pointer: coarse)').matches;

/* ---------- 렌더러 ---------- */
const canvas = $('world');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
} catch (e) {
  const n = $('notice');
  n.textContent = '이 기기나 브라우저에서는 3D 화면을 그릴 수 없어요. 크롬, 엣지, 사파리 최신 버전에서 열어 주세요.';
  n.hidden = false;
  window.__a508ok = true;
  throw e;
}
window.__a508ok = true;
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 600);
const resizeHooks = [];
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  resizeHooks.forEach(f => f(w, h));
}
window.addEventListener('resize', resize);

/* ---------- 늘 같은 모양이 나오도록 번호를 씨앗으로 쓰는 난수 ---------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(508057);

/* ---------- 바닥의 굴곡을 만드는 노이즈 ---------- */
const PERM = new Uint8Array(512);
{
  const p = [...Array(256).keys()];
  for (let i = 255; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; }
  for (let i = 0; i < 512; i++) PERM[i] = p[i & 255];
}
const VAL = new Float32Array(256);
for (let i = 0; i < 256; i++) VAL[i] = rand() * 2 - 1;
const lat = (x, y, z) => VAL[PERM[PERM[PERM[x & 255] + (y & 255)] + (z & 255)]];
const smooth = t => t * t * (3 - 2 * t);
const mix = (a, b, t) => a + (b - a) * t;
const clamp01 = t => Math.min(1, Math.max(0, t));
function vnoise(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const u = smooth(x - xi), v = smooth(y - yi), w = smooth(z - zi);
  return mix(
    mix(mix(lat(xi, yi, zi), lat(xi + 1, yi, zi), u), mix(lat(xi, yi + 1, zi), lat(xi + 1, yi + 1, zi), u), v),
    mix(mix(lat(xi, yi, zi + 1), lat(xi + 1, yi, zi + 1), u), mix(lat(xi, yi + 1, zi + 1), lat(xi + 1, yi + 1, zi + 1), u), v),
    w);
}
function fbm(x, y, z) {
  let s = 0, a = 0.5, f = 1;
  for (let i = 0; i < 4; i++) { s += a * vnoise(x * f, y * f, z * f); f *= 2.03; a *= 0.5; }
  return s;
}

/* ---------- 빛 번짐, 물방울 그림 ---------- */
function radialTexture(stops, size = 128) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  stops.forEach(([o, col]) => gr.addColorStop(o, col));
  g.fillStyle = gr;
  g.fillRect(0, 0, size, size);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const dotTex = radialTexture([[0, 'rgba(255,255,255,1)'], [0.3, 'rgba(255,255,255,.8)'], [0.65, 'rgba(255,255,255,.1)'], [1, 'rgba(255,255,255,0)']], 64);
const glowTex = radialTexture([[0, 'rgba(255,255,255,1)'], [0.1, 'rgba(255,255,255,.7)'], [0.35, 'rgba(255,255,255,.16)'], [1, 'rgba(255,255,255,0)']]);
const bubbleTex = (() => {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const g = c.getContext('2d');
  g.strokeStyle = 'rgba(220,245,255,.9)'; g.lineWidth = 3;
  g.beginPath(); g.arc(32, 32, 26, 0, Math.PI * 2); g.stroke();
  g.fillStyle = 'rgba(220,245,255,.18)'; g.fill();
  g.fillStyle = 'rgba(255,255,255,.9)';
  g.beginPath(); g.arc(22, 22, 6, 0, Math.PI * 2); g.fill();
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();
const glowMat = (color, opacity = 1) => new THREE.SpriteMaterial({ map: glowTex, color, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false });
const noRay = o => { o.raycast = () => {}; return o; };

/* ---------- 바다 색: 수면에서 바닥까지 ---------- */
const SEA_STOPS = [[0, '#58bfe6'], [0.16, '#1f86c4'], [0.4, '#0b4573'], [0.68, '#061f3c'], [1, '#03101c']].map(([k, c]) => [k, new THREE.Color(c)]);
function seaColor(k, out) {
  for (let i = 1; i < SEA_STOPS.length; i++) {
    if (k <= SEA_STOPS[i][0]) {
      const [k0, c0] = SEA_STOPS[i - 1], [k1, c1] = SEA_STOPS[i];
      return out.lerpColors(c0, c1, (k - k0) / (k1 - k0));
    }
  }
  return out.copy(SEA_STOPS[SEA_STOPS.length - 1][1]);
}
scene.background = new THREE.Color('#03101c');
scene.fog = new THREE.FogExp2('#03101c', 0.045);
const hemi = new THREE.HemisphereLight('#2a6aa8', '#04070b', 0.3);
scene.add(hemi);
const topLight = new THREE.DirectionalLight('#7cc7ff', 0.25);
topLight.position.set(10, 50, 6);
scene.add(topLight);
function setDepthLook(k) {
  seaColor(k, scene.background);
  scene.fog.color.copy(scene.background);
  scene.fog.density = 0.006 + 0.039 * k * k;
  hemi.intensity = 0.3 + (1 - k) * 1.8;
  topLight.intensity = 0.25 + (1 - k) * 2.2;
}

/* ---------- 바다 밑바닥 ---------- */
const HOUSE_POS = new THREE.Vector3(0, 0, -9);
const VENT = new THREE.Vector3(14, 0, -24);
function rawGround(x, z) {
  return 1.8 * fbm(x * 0.035 + 5, 0.5, z * 0.035) + 0.45 * fbm(x * 0.14, 3.5, z * 0.14) + 0.25 * Math.sin(x * 0.22 + z * 0.07);
}
const HOUSE_BASE = rawGround(HOUSE_POS.x, HOUSE_POS.z);
HOUSE_POS.y = HOUSE_BASE;
function groundH(x, z) {
  const h = rawGround(x, z);
  const d = Math.hypot(x - HOUSE_POS.x, z - HOUSE_POS.z);
  return d < 4 ? mix(HOUSE_BASE, h, smooth(Math.max(0, (d - 2.4) / 1.6))) : h;
}
VENT.y = groundH(VENT.x, VENT.z);

const FLOOR_SIZE = 190;
const floorGeo = new THREE.PlaneGeometry(FLOOR_SIZE, FLOOR_SIZE, coarse ? 110 : 160, coarse ? 110 : 160);
floorGeo.rotateX(-Math.PI / 2);
{
  const pos = floorGeo.attributes.position;
  const col = new Float32Array(pos.count * 3);
  const c = new THREE.Color(), low = new THREE.Color('#18232b'), mid = new THREE.Color('#3b484f'), high = new THREE.Color('#6d797b');
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i), y = groundH(x, z);
    pos.setY(i, y);
    const t = clamp01((y + 1.2) / 2.6) + 0.12 * vnoise(x * 1.3, 7, z * 1.3);
    if (t < 0.5) c.lerpColors(low, mid, Math.max(0, t) / 0.5); else c.lerpColors(mid, high, Math.min(1, (t - 0.5) / 0.5));
    col.set([c.r, c.g, c.b], i * 3);
  }
  floorGeo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  floorGeo.computeVertexNormals();
}
const floor = new THREE.Mesh(floorGeo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, metalness: 0 }));

const jellies = [];
{
  const colors = ['#8fe3ff', '#ffb3e6', '#b9a3ff', '#7fe7dc'];
  for (let i = 0; i < 8; i++) {
    const color = colors[i % 4];

    const bell = noRay(new THREE.Mesh(new THREE.SphereGeometry(0.7, 20, 10, 0, Math.PI * 2, 0, Math.PI / 2), bellMat));

    glow.scale.setScalar(3.2); glow.position.y = 0.2;
    g.add(glow);
    const TN = 8, TS = 8;
    const tp = new Float32Array(TN * TS * 2 * 3);
    const tg = new THREE.BufferGeometry();
    tg.setAttribute('position', new THREE.BufferAttribute(tp, 3));
    g.add(noRay(new THREE.LineSegments(tg, new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.45 }))));
    const a = rand() * Math.PI * 2, r = 5 + rand() * 32;
    scene.add(g);
    jellies.push({ g, bell, tp, tg, TN, TS, cx: Math.cos(a) * r, cz: Math.sin(a) * r, r: 3 + rand() * 6, sp: (0.03 + rand() * 0.05) * (rand() < 0.5 ? -1 : 1), ph: rand() * 6, baseY: 3 + rand() * 6, size: 0.7 + rand() * 0.7 });
  }
}
function updateJellies(t) {
  for (const j of jellies) {
    const a = j.ph + t * j.sp;
    const x = j.cx + Math.cos(a) * j.r, z = j.cz + Math.sin(a) * j.r;
    j.g.position.set(x, groundH(x, z) + j.baseY + Math.sin(t * 0.5 + j.ph) * 0.9, z);
    j.g.rotation.y = t * 0.1 + j.ph;
    const p = Math.sin(t * 2.2 + j.ph);
    j.g.scale.setScalar(j.size);
    j.bell.scale.set(1 - p * 0.08, 1 + p * 0.14, 1 - p * 0.08);
    let k = 0;
    for (let n = 0; n < j.TN; n++) {
      const an = n / j.TN * Math.PI * 2, ca = Math.cos(an), sa = Math.sin(an);
      for (let s = 0; s < j.TS; s++) {
        for (const ss of [s, s + 1]) {
          const rr = 0.5 * (1 - ss / j.TS * 0.5);
          const sw = Math.sin(t * 1.8 + j.ph + ss * 0.55 + n) * 0.06 * ss;
          j.tp[k++] = ca * rr + sw;
          j.tp[k++] = -ss * 0.3 + p * 0.05;
          j.tp[k++] = sa * rr + sw * 0.6;
        }
      }
    }
    j.tg.attributes.position.needsUpdate = true;
  }
}

function updateSnow(dt, t) {
  const c = camera.position;
  for (let i = 0; i < SNOW_N; i++) {
    const k = i * 3;
    snowPos[k + 1] -= snowSpd[i] * dt;
    snowPos[k] += Math.sin(t * 0.3 + i) * 0.05 * dt;
    for (let ax = 0; ax < 3; ax++) {

      if (d > half) snowPos[k + ax] -= half * 2;

function addLightSprite(L, born) {
  const color = LIGHT_TINTS[(L.c | 0) % LIGHT_TINTS.length];

  if (born) {
    const f = noRay(new THREE.Sprite(glowMat(color, 0.9)));
    f.position.copy(s.position);
    scene.add(f);
    item.flash = f;
  }

}
function updateLightCount() { $('lightCount').textContent = `띄운 빛 ${myLights.length}개`; }
function birthLight(p) {

  myLights.push(L);

}
function updateLights(dt, t) {
  for (const it of lightSprites) {
    it.age += dt;
    const k = clamp01(it.age / 1.2);
    const pop = it.age < 1.2 ? 1 + 1.2 * Math.sin(Math.PI * k) : 1;
    it.s.scale.setScalar(it.base * smooth(k) * pop * (1 + 0.12 * Math.sin(t * 1.5 + it.phase)));
    it.s.position.y = it.y + Math.sin(t * 0.7 + it.phase) * 0.18;
    if (it.flash) {
      const f = clamp01(it.age / 1.4);
      it.flash.scale.setScalar(2 + f * 9);
      it.flash.material.opacity = 0.8 * (1 - f);
      if (f >= 1) { scene.remove(it.flash); it.flash = null; }

}

];
const SINK = 8.8, INTRO_END = 9.8, DEPTH_M = 4000;
let inIntro = true, introT = 0, lineIdx = -1;
const introLine = $('introLine');
const easeInOut = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
function showLine(text) {
  introLine.style.opacity = 0;
  setTimeout(() => { introLine.textContent = text; introLine.style.opacity = 1; }, reduceMotion ? 0 : 350);
}
const startCamY = () => groundH(0, 7.5);
function updateIntro(t) {
  while (lineIdx + 1 < LINES.length && t >= LINES[lineIdx + 1][0]) showLine(LINES[++lineIdx][1]);
  const k = easeInOut(clamp01(t / SINK));
  const endY = Math.max(groundH(0, 0) + 4.2, startCamY() + 1.4);
  const camY = mix(SURF - 12, endY, k);
  camera.position.set(Math.sin(t * 0.1) * 1.5 * (1 - k), camY, mix(12, 7.5, k));
  camera.up.set(0, 1, 0);
  const lookY = mix(camY + 2.5, groundH(0, -4) + 1, smooth(clamp01(k * 1.25)));
  camera.lookAt(0, lookY, -4);
  setDepthLook(k);
  const fromFloor = camY - groundH(0, 0);
  if (fromFloor > 54) scene.fog.density = Math.max(scene.fog.density, 2.4 / fromFloor);
  const top = 1 - clamp01(k / 0.4);
  surface.material.opacity = top;
  surfTex.offset.set(t * 0.01, t * 0.006);
  rays.forEach((r, i) => { r.material.opacity = top * (0.22 + 0.1 * Math.sin(t * 0.8 + i)); });
  $('depthNum').textContent = `${(Math.round(k * DEPTH_M / 10) * 10).toLocaleString('ko-KR')} m`;
  if (t >= INTRO_END) finishIntro();
}

const joy = { x: 0, y: 0, id: null };
{
  const stick = $('stick'), knob = $('knob');
  const setFrom = e => {
    const r = stick.getBoundingClientRect();
    let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const m = Math.hypot(dx, dy), max = r.width / 2 - 12;
    if (m > max) { dx *= max / m; dy *= max / m; }
    knob.style.transform = `translate(${dx}px,${dy}px)`;
    joy.x = dx / max; joy.y = dy / max;
  };
  const end = () => { joy.x = joy.y = 0; joy.id = null; knob.style.transform = ''; };
  stick.addEventListener('pointerdown', e => { joy.id = e.pointerId; stick.setPointerCapture(e.pointerId); setFrom(e); e.preventDefault(); });
  stick.addEventListener('pointermove', e => { if (e.pointerId === joy.id) setFrom(e); });

function updateWalk(dt, t) {
  let move = 0, turn = 0;
  if (keys.has('w') || keys.has('arrowup')) move += 1;
  if (keys.has('s') || keys.has('arrowdown')) move -= 1;
  if (keys.has('a') || keys.has('arrowleft')) turn += 1;
  if (keys.has('d') || keys.has('arrowright')) turn -= 1;
  move += -joy.y; turn += -joy.x * 0.9;
  move = Math.max(-1, Math.min(1, move));
  turn = Math.max(-1, Math.min(1, turn));

  heading += turn * TURN * dt;
  fwd.set(-Math.sin(heading), 0, -Math.cos(heading));
  pos2.x += fwd.x * move * SPEED * dt;
  pos2.y += fwd.z * move * SPEED * dt;
  const r = pos2.length();
  if (r > LIMIT) pos2.multiplyScalar(LIMIT / r);
  {
    const hx = pos2.x - HOUSE_POS.x, hz = pos2.y - HOUSE_POS.z, hd = Math.hypot(hx, hz);
    if (hd < 2.0) { const s = 2.0 / (hd || 1e-3); pos2.set(HOUSE_POS.x + hx * s, HOUSE_POS.z + hz * s); }
  }
  const gy = groundH(pos2.x, pos2.y);
  orb.position.set(pos2.x, gy + 1.2 + Math.sin(t * 2) * 0.1, pos2.y);
  halo.material.opacity = 0.5 + Math.sin(t * 3) * 0.08;

  trailTimer -= dt;
  if (Math.abs(move) > 0.05 && trailTimer <= 0) {
    trailTimer = 0.09;
    const tr = trail[trailIdx++ % trail.length];
    tr.s.position.copy(orb.position).add(tmp.set((Math.random() - 0.5) * 0.3, -0.1, (Math.random() - 0.5) * 0.3));
    tr.life = 1;
    tr.size = 0.05 + Math.random() * 0.07;
    tr.s.visible = true;
  }
  for (const tr of trail) {
    if (tr.life <= 0) continue;
    tr.life -= dt * 0.5;
    tr.s.position.y += dt * 0.9;
    tr.s.material.opacity = Math.max(0, tr.life) * 0.8;
    tr.s.scale.setScalar(tr.size * (1.4 - tr.life * 0.4));
    if (tr.life <= 0) tr.s.visible = false;
  }

  followRate = followRate > 4 ? followRate : Math.min(4, followRate + dt * 1.6);
  const a = snapCam ? 1 : 1 - Math.exp(-dt * followRate);
  snapCam = false;
  camGoal.copy(orb.position).add(tmp.set(0, 3, 0)).addScaledVector(fwd, -7.5);
  camGoal.y = Math.max(camGoal.y, groundH(camGoal.x, camGoal.z) + 1.3);
  camera.position.lerp(camGoal, a);
  camera.up.set(0, 1, 0);
  lookTarget.lerp(tmp.copy(orb.position).addScaledVector(fwd, 4).add(new THREE.Vector3(0, 0.8, 0)), a);
  camera.lookAt(lookTarget);

  let foundNow = null;
  for (const c of creatures) {
    const near = orb.position.distanceTo(c.pos) < 3.6;
    c.lit += ((near ? 1 : 0) - c.lit) * Math.min(1, dt * 3);
    if (near && !c.found) { c.found = true; foundNow = c; }
  }
  const nearDoor = orb.position.distanceTo(doorWorld) < 2.4;
  if (nearDoor !== showingEnter) {
    showingEnter = nearDoor;
    $('enterHouse').classList.toggle('is-hidden', !nearDoor);
  }
  if (foundNow) {
    const n = creatures.filter(c => c.found).length;
    $('found').textContent = `빛나는 생물 ${n} / ${creatures.length}`;
    toast(n === creatures.length ? '빛나는 생물을 모두 찾았어요' : `빛나는 생물을 찾았어요 · ${n} / ${creatures.length}`);
  }
}
function updateCreatures(t) {
  for (const c of creatures) {
    c.mat.emissiveIntensity = 0.6 + c.lit * 2.2 + (c.found ? 0.4 : 0) + Math.sin(t * 1.3 + c.ph) * 0.15;
    c.glow.material.opacity = 0.22 + c.lit * 0.5 + (c.found ? 0.1 : 0);
    c.g.rotation.z = Math.sin(t * 0.8 + c.ph) * 0.07;
  }
}

function plankTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 512;
  const g = c.getContext('2d');
  const rows = 8, h = 512 / rows;
  for (let r = 0; r < rows; r++) {
    let x = -(r % 2) * 128;
    while (x < 512) {
      const w = 180 + Math.floor(rand() * 120);
      const v = 222 + Math.floor(rand() * 30);
      g.fillStyle = `rgb(${v},${v},${v})`;
      g.fillRect(x, r * h, w, h);
      g.fillStyle = 'rgba(0,0,0,.18)';
      g.fillRect(x, r * h, 2, h);
      x += w;
    }
    g.fillStyle = 'rgba(0,0,0,.2)';
    g.fillRect(0, r * h, 512, 2);
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(2, 2);
  return t;
}
function windowTexture() {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 288;
  const g = c.getContext('2d');
  const bg = g.createLinearGradient(0, 0, 0, 288);
  bg.addColorStop(0, '#0a2a45'); bg.addColorStop(1, '#020a14');
  g.fillStyle = bg; g.fillRect(0, 0, 512, 288);
  g.fillStyle = '#0d1a22';
  g.beginPath(); g.moveTo(0, 288);
  for (let x = 0; x <= 512; x += 16) g.lineTo(x, 236 + Math.sin(x * 0.02) * 14 + Math.sin(x * 0.07) * 6);
  g.lineTo(512, 288); g.fill();
  [[110, 90, '#8fe3ff', 26], [360, 70, '#ffb3e6', 20], [270, 160, '#b9a3ff', 15]].forEach(([x, y, col, r]) => {
    const gl = g.createRadialGradient(x, y, 0, x, y, r * 3);
    gl.addColorStop(0, col + 'aa'); gl.addColorStop(1, col + '00');
    g.fillStyle = gl; g.fillRect(x - r * 3, y - r * 3, r * 6, r * 6);
    g.fillStyle = col + 'cc';
    g.beginPath(); g.arc(x, y, r, Math.PI, 0); g.closePath(); g.fill();
    g.strokeStyle = col + '88'; g.lineWidth = 1.5;
    for (let k = -3; k <= 3; k++) {
      g.beginPath(); g.moveTo(x + k * r / 4, y);
      g.bezierCurveTo(x + k * r / 4 + 6, y + r, x + k * r / 4 - 6, y + r * 2, x + k * r / 4 + 3, y + r * 3);
      g.stroke();
    }
  });
  for (let i = 0; i < 220; i++) {
    g.fillStyle = `rgba(207,227,234,${0.2 + rand() * 0.5})`;
    g.beginPath(); g.arc(rand() * 512, rand() * 250, rand() < 0.1 ? 1.4 : 0.8, 0, Math.PI * 2); g.fill();
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

    P(g, Cy(0.35, 0.27, 0.6, 20), m, 0, 0.3, 0);
    P(g, Cy(0.32, 0.32, 0.04, 20), mk('#4a3a30'), 0, 0.58, 0);
    const leaf = mk(LEAF, { flatShading: true });
    [[0, 1.0, 0, 0.42], [0.25, 0.85, 0.1, 0.32], [-0.22, 0.9, -0.12, 0.34], [0.05, 1.32, 0.05, 0.3], [-0.1, 0.78, 0.25, 0.28]]
      .forEach(([x, y, z, r]) => P(g, new THREE.IcosahedronGeometry(r, 0), leaf, x, y, z));
  } },
  lamp: { label: '스탠드', r: 0.5, c: 7, glow: 0.55, build(g, m) {
    P(g, Cy(0.28, 0.32, 0.06, 20), mk(DARK), 0, 0.03, 0);
    P(g, Cy(0.03, 0.03, 1.6, 8), mk(BRASS, { metalness: 0.4, roughness: 0.4 }), 0, 0.85, 0);
    P(g, Cy(0.24, 0.42, 0.5, 24), m, 0, 1.8, 0);
    return [glowIn(g, '#ffd7a1', 0, 1.65, 0, 2.8, 0.5)];
  } },
  starlamp: { label: '별 무드등', r: 0.5, c: 7, glow: 1.2, build(g, m) {
    P(g, Cy(0.25, 0.3, 0.12, 20), mk(DARK), 0, 0.06, 0);
    P(g, Cy(0.025, 0.025, 0.6, 8), mk(DARK), 0, 0.4, 0);
    const st = P(g, new THREE.OctahedronGeometry(0.32, 0), m, 0, 0.78, 0);
    st.scale.set(1, 1.3, 1);
    st.rotation.y = Math.PI / 4;
    return [glowIn(g, PALETTE[7], 0, 0.78, 0, 2.4, 0.6)];
  } },
  rug: { label: '러그', r: 1.7, c: 6, build(g, m) {
    P(g, Cy(1.7, 1.7, 0.03, 48), m, 0, 0.015, 0);
    const ring = P(g, new THREE.RingGeometry(1.28, 1.4, 48), mk(CLOTH), 0, 0.034, 0);
    ring.rotation.x = -Math.PI / 2;
  } },
  beanbag: { label: '빈백', r: 0.8, c: 3, build(g, m) {
    P(g, new THREE.SphereGeometry(0.75, 24, 16), m, 0, 0.45, 0).scale.set(1, 0.62, 1);
  } },
  telescope: { label: '망원경', r: 0.8, c: 8, build(g, m) {
    const leg = mk(DARK);
    for (let i = 0; i < 3; i++) {
      const a = i * 2.094, sx = Math.sin(a), sz = Math.cos(a);
      const l = P(g, Cy(0.03, 0.03, 1.3, 8), leg, sx * 0.25, 0.62, sz * 0.25);
      l.rotation.set(-sz * 0.3, 0, sx * 0.3);
    }
    P(g, Cy(0.13, 0.13, 0.18, 12), leg, 0, 1.28, 0);
    const tube = P(g, Cy(0.12, 0.17, 1.5, 20), m, 0, 1.55, -0.2);
    tube.rotation.x = -Math.PI / 2 + 0.55;
    const eye = P(g, Cy(0.05, 0.05, 0.22, 10), leg, 0, 1.2, 0.45);
    eye.rotation.x = -Math.PI / 2 + 0.55;
  } },
};
const CATALOG_ORDER = ['bed', 'bunk', 'sofa', 'chair', 'table', 'shelf', 'dresser', 'plant', 'lamp', 'starlamp', 'rug', 'beanbag', 'telescope'];

/* 방 저장 (이 기기에만) */
const ROOM_KEY = 'a508057:room';
const DEFAULT_ROOM = () => ({ wall: 0, floor: 0, items: [
  { t: 'rug', x: 0, z: 0.8, r: 0, c: 6 },
  { t: 'bed', x: -3.4, z: -3.6, r: 0, c: 5 },
  { t: 'lamp', x: -1.4, z: -5, r: 0, c: 7 },
  { t: 'telescope', x: 1.4, z: -4.3, r: 0, c: 8 },
  { t: 'plant', x: 4.6, z: -4.8, r: 0, c: 0 },
  { t: 'shelf', x: -5.2, z: 1.6, r: 2, c: 1 },
  { t: 'beanbag', x: 2.4, z: 1.8, r: 0, c: 3 },
  { t: 'starlamp', x: 4.6, z: 3.8, r: 0, c: 7 },
] });
let room = DEFAULT_ROOM();
try {
  const r = JSON.parse(localStorage.getItem(ROOM_KEY) || 'null');
  if (r && Array.isArray(r.items)) {
    room = {
      wall: Math.min(WALLS.length - 1, Math.max(0, r.wall | 0)),
      floor: Math.min(FLOORS.length - 1, Math.max(0, r.floor | 0)),
      items: r.items.filter(i => i && CATALOG[i.t]).map(i => ({ t: i.t, x: +i.x || 0, z: +i.z || 0, r: (i.r | 0) % 8, c: Math.abs(i.c | 0) % PALETTE.length })),
    };
  }
} catch (e) { room = DEFAULT_ROOM(); }
const saveRoom = () => { try { localStorage.setItem(ROOM_KEY, JSON.stringify(room)); } catch (e) {} };

const itemRoots = [];
function makeItem(d) {
  const def = CATALOG[d.t];
  const color = PALETTE[d.c];
  const main = def.glow ? mk(color, { emissive: color, emissiveIntensity: def.glow }) : mk(color);
  const g = new THREE.Group();
  const glows = def.build(g, main) || [];
  g.position.set(d.x, 0, d.z);
  g.rotation.y = d.r * Math.PI / 4;
  g.userData = { d, main, glows };
  if (d.t === 'starlamp') glows.forEach(s => s.material.color.set(color));
  roomScene.add(g);
  itemRoots.push(g);
  return g;
}
function paintItem(g) {
  const { d, main, glows } = g.userData;
  const color = PALETTE[d.c];
  main.color.set(color);
  if (CATALOG[d.t].glow) main.emissive.set(color);
  if (d.t === 'starlamp') glows.forEach(s => s.material.color.set(color));
}
room.items.forEach(makeItem);
wallMat.color.set(WALLS[room.wall][1]);
floorMat.color.set(FLOORS[room.floor][1]);

const selRing = new THREE.Mesh(new THREE.RingGeometry(0.9, 1, 48), new THREE.MeshBasicMaterial({ color: '#ffd7a1', transparent: true, opacity: 0.85, depthWrite: false }));
selRing.rotation.x = -Math.PI / 2;
selRing.visible = false;
roomScene.add(selRing);

let selected = null, dragging = false, downIn = null;
let yaw = 0, yawTarget = 0;
const dragOff = new THREE.Vector3(), floorHit = new THREE.Vector3();
const floorPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const lim = d => ROOM - CATALOG[d.t].r * 0.8;
const clampTo = (v, m) => Math.max(-m, Math.min(m, v));

function select(g) {
  if (selected && selected !== g) selected.position.y = 0;
  selected = g;
  selRing.visible = !!g;
  $('selBar').hidden = !g;
  if (g) {
    const d = g.userData.d;
    selRing.scale.setScalar(CATALOG[d.t].r);
    $('selName').textContent = `${CATALOG[d.t].label} · ${PALETTE_NAMES[d.c]}`;
  }
  updateRoomHint();
}
function updateRoomHint() {
  $('roomHint').textContent = selected
    ? '끌어서 옮길 수 있어요. 바꾼 건 이 기기에 저절로 저장돼요.'
    : (room.items.length ? '가구를 누르면 고를 수 있어요. 아래에서 새 가구를 골라 놓을 수도 있어요.' : '방이 비었어요. 아래에서 가구를 골라 놓아 보세요.');
}
function addItem(t) {
  const def = CATALOG[t];
  const d = { t, x: clampTo((Math.random() - 0.5) * 2, 6), z: clampTo(1 + (Math.random() - 0.5) * 2, 6), r: 0, c: def.c };
  d.x = clampTo(d.x, lim(d)); d.z = clampTo(d.z, lim(d));
  room.items.push(d);
  select(makeItem(d));
  saveRoom();
}
function removeSelected() {
  if (!selected) return;
  const g = selected;
  select(null);
  roomScene.remove(g);
  itemRoots.splice(itemRoots.indexOf(g), 1);
  room.items.splice(room.items.indexOf(g.userData.d), 1);
  saveRoom();
  updateRoomHint();
}
function rotateSelected() {
  if (!selected) return;
  const d = selected.userData.d;
  d.r = (d.r + 1) % 8;
  selected.rotation.y = d.r * Math.PI / 4;
  saveRoom();
}
function recolorSelected() {
  if (!selected) return;
  const d = selected.userData.d;
  d.c = (d.c + 1) % PALETTE.length;
  paintItem(selected);
  select(selected);
  saveRoom();
}

/* 패널 만들기 */
CATALOG_ORDER.forEach(t => {
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = CATALOG[t].label;
  b.addEventListener('click', () => addItem(t));
  $('paneItems').appendChild(b);
});
function swatches(rowId, list, key, apply) {
  const row = $(rowId);
  list.forEach(([name, color], i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'swatch';
    b.style.background = color;
    b.setAttribute('aria-label', `${row.querySelector('.lbl').textContent} ${name}`);
    b.title = name;
    b.setAttribute('aria-pressed', String(room[key] === i));
    b.addEventListener('click', () => {
      room[key] = i;
      apply(color);
      row.querySelectorAll('.swatch').forEach((s, j) => s.setAttribute('aria-pressed', String(j === i)));
      saveRoom();
    });
    row.appendChild(b);
  });
}
swatches('wallRow', WALLS, 'wall', c => wallMat.color.set(c));
swatches('floorRow', FLOORS, 'floor', c => floorMat.color.set(c));
function showTab(which) {
  const items = which === 'items';
  $('tabItems').setAttribute('aria-selected', String(items));
  $('tabRoom').setAttribute('aria-selected', String(!items));
  $('paneItems').hidden = !items;
  $('paneRoom').hidden = items;
}
$('tabItems').addEventListener('click', () => showTab('items'));
$('tabRoom').addEventListener('click', () => showTab('room'));
$('selRotate').addEventListener('click', rotateSelected);
$('selColor').addEventListener('click', recolorSelected);
$('selDelete').addEventListener('click', removeSelected);
$('selDone').addEventListener('click', () => select(null));
$('viewL').addEventListener('click', () => { yawTarget -= Math.PI / 4; });
$('viewR').addEventListener('click', () => { yawTarget += Math.PI / 4; });
updateRoomHint();

/* 방 안에서 누르고 끌기 */
function setNdc(e) { ndc.set(e.clientX / window.innerWidth * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1); }
function pickItem(e) {
  setNdc(e);
  raycaster.setFromCamera(ndc, roomCam);
  const hit = raycaster.intersectObjects(itemRoots, true)[0];
  let o = hit && hit.object;
  while (o && !(o.userData && o.userData.d)) o = o.parent;
  return o || null;
}
function floorAt(e) {
  setNdc(e);
  raycaster.setFromCamera(ndc, roomCam);
  return raycaster.ray.intersectPlane(floorPlane, floorHit);
}
canvas.addEventListener('pointerdown', e => {
  if (mode !== 'inside') return;
  const g = pickItem(e);
  downIn = { x: e.clientX, y: e.clientY, t: performance.now(), g };
  if (!g) return;
  select(g);
  const p = floorAt(e);
  if (p) {
    dragOff.set(p.x - g.position.x, 0, p.z - g.position.z);
    dragging = true;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  }
});
canvas.addEventListener('pointermove', e => {
  if (mode !== 'inside' || !dragging || !selected) return;
  const p = floorAt(e);
  if (!p) return;
  const m = lim(selected.userData.d);
  selected.position.x = clampTo(p.x - dragOff.x, m);
  selected.position.z = clampTo(p.z - dragOff.z, m);
});
const endDrag = e => {
  if (mode !== 'inside') return;
  if (dragging && selected) {
    const d = selected.userData.d;
    d.x = +selected.position.x.toFixed(2);
    d.z = +selected.position.z.toFixed(2);
    saveRoom();
  } else if (downIn && !downIn.g && e.type === 'pointerup') {
    if (Math.hypot(e.clientX - downIn.x, e.clientY - downIn.y) < 10 && performance.now() - downIn.t < 450) select(null);
  }
  dragging = false;
  downIn = null;
};
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

function updateRoom(dt, t) {
  yaw += (yawTarget - yaw) * (1 - Math.exp(-dt * 6));
  const asp = roomCam.aspect;
  const D = asp < 1 ? 15 + (1 - asp) * 18 : 15;
  roomCam.position.set(Math.sin(yaw) * D, D * 0.8, Math.cos(yaw) * D);
  roomCam.lookAt(0, asp < 1 ? -0.6 : -1.6, 0);
  const cdir = new THREE.Vector2(Math.sin(yaw), Math.cos(yaw));
  for (const w of walls) w.g.visible = w.n.dot(cdir) < 0.35;
  if (selected) {
    selected.position.y = dragging ? 0.15 : 0;
    selRing.position.set(selected.position.x, 0.04, selected.position.z);
    selRing.material.opacity = 0.6 + Math.sin(t * 4) * 0.25;
  }
  for (const g of itemRoots) {
    if (g.userData.d.t === 'starlamp') g.userData.glows.forEach(s => { s.material.opacity = 0.5 + Math.sin(t * 1.6 + g.position.x) * 0.15; });
  }
}

/* ---------- 들어가고 나오기 ---------- */
let busy = false, showingEnter = false;
const curtain = $('curtain');
const OUTSIDE_UI = ['hud', 'stick', 'makeStar'];
function swapScene(fn) {
  if (busy) return;
  busy = true;
  curtain.style.opacity = 1;
  setTimeout(() => {
    fn();
    curtain.style.opacity = 0;
    busy = false;
  }, reduceMotion ? 0 : 480);
}
function goInside() {
  if (mode !== 'outside' || inIntro) return;
  swapScene(() => {
    mode = 'inside';
    keys.clear();
    OUTSIDE_UI.forEach(id => $(id).classList.add('is-hidden'));
    $('enterHouse').classList.add('is-hidden');
    $('toast').classList.add('is-hidden');
    showingEnter = false;
    $('roomUi').classList.remove('is-hidden');
  });
}
function goOutside() {
  if (mode !== 'inside') return;
  swapScene(() => {
    select(null);
    dragging = false;
    mode = 'outside';
    keys.clear();
    $('roomUi').classList.add('is-hidden');
    OUTSIDE_UI.forEach(id => $(id).classList.remove('is-hidden'));
    placeAtDoor();
    snapCam = true;
  });
}
$('enterHouse').addEventListener('click', goInside);
$('exitHouse').addEventListener('click', goOutside);


/* ---------- 안내 ---------- */
let toastTimer = null;
function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.remove('is-hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add('is-hidden'), 2200);
}
$('hint').textContent = coarse
  ? '왼쪽 아래 원을 밀어서 다니기 · 물속을 눌러 빛 띄우기'
  : 'W A S D 또는 방향키로 다니기 · 물속을 누르거나 스페이스바로 빛 띄우기 · 집 문 앞에서 E로 들어가기';

$('skip').addEventListener('click', () => { if (inIntro) finishIntro(); });
$('replay').addEventListener('click', startIntro);

myLights.forEach(L => addLightSprite(L, false));
updateLightCount();
resize();
camera.position.set(0, SURF - 12, 12);

/* ---------- 움직이기 ---------- */
const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  if (mode === 'inside') {
    updateRoom(dt, t);
    renderer.render(roomScene, roomCam);
  } else {
    if (inIntro) { introT += dt; updateIntro(introT); }
    else updateWalk(dt, t);
    updateJellies(t);
    updateSnow(dt, t);
    updateHouseBits(dt, t);
    updateCreatures(t);
    updateLights(dt, t);
    renderer.render(scene, camera);
  }
  requestAnimationFrame(frame);
}
setDepthLook(0);
if (reduceMotion) finishIntro();
frame();
</script>
</body>
</html>
