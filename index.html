<title>짹짹이</title>

<style>
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#1b2430; --muted:#5d6a78; --line:#d9dfe6;
  --accent:#2b5c8a; --accent-ink:#ffffff; --accent-soft:#e3edf6;
  --mark:#ffe58a; --mark-ink:#1b2430; --done:#8a96a3; --tr:#3d6b4f;
  --skip-bg:#eef1f4; --warn:#9a5b00;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#12171d; --surface:#1a2129; --ink:#e4e9ef; --muted:#9aa7b4; --line:#2c3642;
    --accent:#6ea4d6; --accent-ink:#0e1a26; --accent-soft:#1f3345;
    --mark:#5c4a0f; --mark-ink:#fff4c9; --done:#6b7784; --tr:#8cc7a0;
    --skip-bg:#161c23; --warn:#e0a44a;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#12171d; --surface:#1a2129; --ink:#e4e9ef; --muted:#9aa7b4; --line:#2c3642;
  --accent:#6ea4d6; --accent-ink:#0e1a26; --accent-soft:#1f3345;
  --mark:#5c4a0f; --mark-ink:#fff4c9; --done:#6b7784; --tr:#8cc7a0;
  --skip-bg:#161c23; --warn:#e0a44a;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
/* 본문이 짧아도 재생 바가 화면 맨 아래에 오도록 */
body{min-height:calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column}
.wrap{flex:1 0 auto;width:100%}
a.btn{text-decoration:none;display:inline-block}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.6}
.wrap{max-width:780px;margin:0 auto;padding-inline:16px;padding-block:28px 24px;display:grid;gap:18px}
h1{font-size:1.5rem;margin:0;text-wrap:balance}
.lede{margin:4px 0 0;color:var(--muted)}
.label{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.72rem;letter-spacing:.04em;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}

/* 파일을 화면에 끌어다 놓을 때 */
body.drag .doc{outline:2px dashed var(--accent);outline-offset:4px}
.error{color:var(--warn);font-size:.9rem;margin:0}
.scan{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;font-size:.85rem}
.busy{color:var(--muted);font-size:.78rem;white-space:nowrap}
.busy:empty{display:none}
.wrap{padding-block:18px 24px}
.lg{display:none}
@media (min-width:640px){.lg{display:inline}}
/* 마우스를 올리면 보이는 설명 */
@media (hover:hover){
  [data-tip]{position:relative}
  [data-tip]:hover::before,[data-tip]:focus-visible::before{content:attr(data-tip);position:absolute;top:calc(100% + 8px);left:0;z-index:40;width:max-content;max-width:260px;white-space:pre-line;text-align:left;background:var(--ink);color:var(--bg);font-size:.75rem;font-weight:400;line-height:1.5;padding:6px 9px;border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.18);pointer-events:none}
  .tip-r[data-tip]:hover::before,.tip-r[data-tip]:focus-visible::before{left:auto;right:0}
  .player [data-tip]:hover::before,.player [data-tip]:focus-visible::before{top:auto;bottom:calc(100% + 8px)}
  .dd[open]>summary::before{display:none!important}
}
.dd .v{display:none}
@media (min-width:640px){.dd .v{display:inline}}

/* 설정 */
/* 위쪽 바: 아래 재생 바와 같은 모양 */
.topbar{position:sticky;top:env(safe-area-inset-top, 0px);z-index:6;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 4px 16px rgba(20,30,45,.05);padding:10px 16px}
.toolbar{max-width:780px;margin:0 auto;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.dd{position:relative}
.dd>summary{list-style:none;display:flex;align-items:center;gap:6px;font-size:.85rem;line-height:1.6;padding:6px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);cursor:pointer;white-space:nowrap;user-select:none}
.dd>summary::-webkit-details-marker{display:none}
.dd>summary::after{content:"";width:6px;height:6px;margin:0 2px 3px 2px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);opacity:.7}
.dd>summary:hover{border-color:var(--muted)}
.dd[open]>summary{border-color:var(--accent)}
.dd.file>summary{background:transparent;border-color:var(--accent);color:var(--accent);font-weight:500}
.dd .k{color:var(--ink)}
.dd .v{font-weight:600;color:var(--accent)}
.menu{position:absolute;top:calc(100% + 6px);left:0;z-index:20;width:max-content;min-width:200px;max-width:min(300px, calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px rgba(20,30,45,.16);padding:6px;display:grid;gap:1px}
.menu.right{left:auto;right:0}
.opt{position:relative;text-align:left;font:inherit;font-size:.86rem;padding:7px 10px 7px 28px;border:0;border-radius:6px;background:none;color:var(--ink);cursor:pointer}
.opt:hover:not(:disabled){background:var(--bg)}
.opt[aria-pressed="true"]{color:var(--accent);font-weight:600}
.opt[aria-pressed="true"]::before{content:"✓";position:absolute;left:10px}
.opt:disabled{opacity:.45;cursor:default}
.mcheck{display:flex;align-items:center;gap:8px;font-size:.86rem;padding:7px 10px;border-radius:6px;cursor:pointer}
.mcheck:hover{background:var(--bg)}
.mcheck input{accent-color:var(--accent);margin:0}
.menu .hint{padding:4px 10px 6px;font-size:.76rem}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.hint{color:var(--muted);font-size:.8rem;margin:0}
select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px;width:100%}
.field{display:grid;gap:3px;padding:6px 8px;min-width:0}
.mini{font-size:.74rem;color:var(--muted)}

/* 본문 */
.doc{padding:22px 24px;font-size:1rem;line-height:1.85;display:grid;gap:12px}
.doc p{margin:0}
.doc .h{font-weight:700;font-size:1.05rem;margin-top:6px}
.doc .h.title{font-size:1.2rem}
.pg{display:block;font-family:"IBM Plex Mono",monospace;font-size:.7rem;color:var(--muted);letter-spacing:.06em;border-top:1px dashed var(--line);padding-top:6px}
.s{border-radius:3px;transition:background .15s}
.s:hover{cursor:pointer;text-decoration:underline dotted var(--muted)}
.s.now{background:var(--mark);color:var(--mark-ink)}
.s.read{color:var(--done)}
.s.start{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent);padding-left:4px}
.cite{color:var(--muted)}
.strip .cite{text-decoration:line-through;opacity:.6}
.pair{display:grid;gap:2px;margin-bottom:8px}
.pair .s{display:block}
.tr{display:block;color:var(--tr);font-size:.95rem;line-height:1.7}
.tr.wait{color:var(--muted);font-style:italic}
.skip{background:var(--skip-bg);border-radius:6px;padding:8px 10px;font-size:.82rem;line-height:1.5;color:var(--muted);white-space:pre-line;text-decoration:line-through;text-decoration-color:color-mix(in srgb, var(--muted) 60%, transparent)}
.skip .why{display:inline-block;text-decoration:none;font-family:"IBM Plex Mono",monospace;font-size:.68rem;letter-spacing:.05em;border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:6px;background:var(--surface)}
.hide-skips .skip{display:none}
.empty{color:var(--muted)}

/* 재생 바 */
.player{position:sticky;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(20,30,45,.06);padding:10px 16px calc(12px + env(safe-area-inset-bottom, 0px))}
.player-in{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:6px}
.btn{font:inherit;font-weight:500;font-size:.85rem;padding:6px 12px;border-radius:7px;border:1px solid var(--accent);cursor:pointer;background:var(--accent);color:var(--accent-ink);white-space:nowrap}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.icon{padding:6px 9px;min-width:34px}
.btn:disabled{opacity:.45;cursor:default}
.jump{flex:1 1 auto;min-width:0}
.jump select{padding:6px;font-size:.85rem}
#rate{width:auto;font-size:.82rem;padding:6px 4px;flex:none}
.status{color:var(--muted);font-size:.78rem;white-space:nowrap;flex:none;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:600px){

  .doc{padding:16px}
  .status{display:none}
}
@media (prefers-reduced-motion:reduce){.s{transition:none}}
/* 이 버전에서 안 되는 기능 */
.dd.off>summary{color:var(--muted)}
.dd.off .k{color:var(--muted)}
.dd.off .v{display:inline;color:var(--muted);font-weight:500}
.off-note{margin:4px 2px 2px;padding:8px 10px;border-radius:6px;background:var(--bg);color:var(--muted);font-size:.8rem;line-height:1.5}
.off-note a{color:var(--accent)}
/* 이름표 */
.brand{display:flex;align-items:center;gap:6px;margin-right:8px;flex:none}
.logo{height:40px;width:auto;flex:none;display:block}
/* 초등학교 1학년이 크레파스로 쓴 이름 */
.name{height:34px;width:auto;flex:none;display:block;color:var(--ink)}
@media (max-width:480px){
  .toolbar{gap:5px}
  .brand{flex-basis:100%;margin:0 0 2px}
  .logo{height:34px}
  .name{height:28px}
  .dd>summary{padding:6px 6px 6px 8px;gap:3px;font-size:.82rem}
  .player-in{gap:5px}
}
</style>
</head>

<script>
// ---- PDF → 본문 추출 ----------------------------------------------------
// 1) 페이지마다 텍스트 줄을 좌표·글자 크기와 함께 뽑는다.
// 2) 줄마다 종류를 판별한다 (본문 / 머리말·꼬리말 / 쪽 번호 / 각주 / 캡션 / 참고문헌 …).
// 3) 남은 본문 줄을 문단으로 합치고, 줄 끝 하이픈을 복구한다.

async function extractLines(pdf, onProgress){
  const lines = [];
  for (let p = 1; p <= pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const vp = page.getViewport({scale: 1});
    const tc = await page.getTextContent();
    let cur = null;
    const flush = () => { if (cur && cur.text.trim()){ cur.text = cur.text.replace(/\s+/g, " ").trim(); lines.push(cur); } cur = null; };
    for (const it of tc.items){
      if (!("str" in it)) continue;
      const [a, b, c, d, x, y] = it.transform;
      const rotated = Math.abs(b) > 0.01 || Math.abs(c) > 0.01;
      const size = Math.hypot(c, d) || it.height || 10;
      const w = it.width || 0;
      if (!it.str){ if (it.hasEOL) flush(); continue; }
      const sameLine = cur && cur.rotated === rotated && Math.abs(y - cur.y) < size * 0.5 && x > cur.xEnd - size * 1.5;
      if (!sameLine){
        flush();
        cur = {text: "", x, y, xEnd: x, size, sizeChars: 0, rotated, page: p, pageH: vp.height, pageW: vp.width};
      }
      const gap = x - cur.xEnd;
      if (cur.text && gap > size * 0.15 && !/\s$/.test(cur.text) && !/^\s/.test(it.str)) cur.text += " ";
      cur.text += it.str;
      cur.xEnd = Math.max(cur.xEnd, x + w);
      const n = it.str.trim().length;
      if (n > cur.sizeChars){ cur.size = size; cur.sizeChars = n; }
      if (it.hasEOL) flush();
    }
    flush();
    onProgress && onProgress(p, pdf.numPages);
  }
  return lines;
}

const RE_PAGENUM = /^(?:page\s*|p\.\s*)?[-–—(\[]?\s*(?:\d{1,4}|[ivxlc]{1,6})\s*[-–—)\]]?(?:\s*(?:\/|of)\s*\d{1,4})?$/i;
const RE_ABSTRACT = /^(?:abstract|summary|초\s*록|국문\s*초록|요\s*약|요\s*지)(?![A-Za-z가-힣])/i;
const RE_REFS = /^(?:[\dIVX]+\.?\s*)?(?:references?|bibliography|literature cited|works cited|참\s*고\s*문\s*헌|인용\s*문헌)\s*$/i;
const RE_CAPTION = /^[<\[(]?\s*(?:fig(?:ure)?\.?|table|tab\.|그림|표|사진|도표)\s*\d+(?:[.-]\d+)?\s*[>\])]?\s*[.:：]?/i;
const RE_HEADING = /^(?:\d+(?:\.\d+){0,3}\.?|[IVX]{1,5}\.|[A-Z]\.|제\s*\d+\s*[장절])\s+\S/;

function classify(lines, opt){
  const nPages = lines.length ? lines[lines.length - 1].page : 0;

  // 가장 많이 쓰인 글자 크기 = 본문 크기
  const hist = {};
  for (const l of lines) if (!l.rotated){ const k = Math.round(l.size * 2) / 2; hist[k] = (hist[k] || 0) + l.text.length; }
  const bodySize = +Object.entries(hist).sort((a, b) => b[1] - a[1])[0]?.[0] || 10;

  // 위·아래 여백에서 여러 쪽에 반복되는 줄 = 머리말/꼬리말
  const inMargin = l => l.y > l.pageH * 0.9 || l.y < l.pageH * 0.1;
  const keyOf = l => l.text.toLowerCase().replace(/\d+/g, "#").replace(/\s+/g, " ");
  const pagesByKey = {};
  for (const l of lines) if (inMargin(l)) (pagesByKey[keyOf(l)] ||= new Set()).add(l.page);
  const repeatMin = Math.max(2, Math.ceil(nPages * 0.4));

  // 초록이 앞 2쪽 안에 있으면 그 앞(제목 제외)은 저자·소속 정보로 본다
  const absIdx = lines.findIndex(l => l.page <= 2 && RE_ABSTRACT.test(l.text));

  let inRefs = false, inCaption = null;
  lines.forEach((l, i) => {
    l.kind = "body"; l.reason = "";
    const t = l.text;
    const skip = (kind, reason) => { l.kind = kind; l.reason = reason; };

    if (l.rotated || /^arxiv:\s?\d{4}\.\d{4,5}/i.test(t)){ skip("margin", "여백 표기"); return; }
    if (inMargin(l) && RE_PAGENUM.test(t)){ skip("pagenum", "쪽 번호"); return; }
    if (inMargin(l) && nPages > 1 && pagesByKey[keyOf(l)]?.size >= repeatMin){ skip("header", "머리말·꼬리말"); return; }
    if (inRefs){ skip("refs", "참고문헌"); return; }
    if (RE_REFS.test(t)){ inRefs = opt.refs; if (inRefs){ skip("refs", "참고문헌"); return; } }
    if (opt.front && absIdx > 0 && i < absIdx && l.size < bodySize * 1.3){ skip("front", "저자·소속"); return; }

    if (inCaption){
      const prev = lines[i - 1];
      const near = prev && prev.page === l.page && Math.abs(prev.y - l.y) < l.size * 1.8;
      if (near && Math.abs(l.size - inCaption.size) < 0.6 && !/[.。]$/.test(prev.text)){ skip("caption", "그림·표 설명"); return; }
      inCaption = null;
    }
    if (opt.caption && RE_CAPTION.test(t)){ inCaption = l; skip("caption", "그림·표 설명"); return; }
    if (opt.small && l.size < bodySize * 0.88){ skip("small", "각주·작은 글씨"); return; }

    const short = t.length < 70 && !/[.,;:。]$/.test(t);
    if (short && (RE_HEADING.test(t) || RE_ABSTRACT.test(t) || l.size > bodySize * 1.12)) l.kind = "heading";
  });
  return {bodySize};
}

// 본문 줄 → 문단/제목 블록. 중간에 끼어든 제외 줄은 문단이 끝난 뒤에 붙인다.
function buildBlocks(lines){
  const blocks = [];
  const gaps = [];
  for (let i = 1; i < lines.length; i++){
    const a = lines[i - 1], b = lines[i];
    if (a.kind === "body" && b.kind === "body" && a.page === b.page && a.y > b.y) gaps.push(a.y - b.y);
  }
  gaps.sort((x, y) => x - y);
  const leading = gaps[Math.floor(gaps.length / 2)] || 12;

  let para = null, prev = null, pendingSkips = [];
  const closePara = () => {
    if (para){ blocks.push(para); para = null; }
    for (const s of pendingSkips) blocks.push(s);
    pendingSkips = [];
  };
  const addSkip = l => {
    const target = para ? pendingSkips : blocks;
    const last = target[target.length - 1];
    if (last && last.kind === "skip" && last.reason === l.reason && last.page === l.page) last.text += "\n" + l.text;
    else target.push({kind: "skip", reason: l.reason, page: l.page, text: l.text});
  };

  for (const l of lines){
    if (l.kind !== "body" && l.kind !== "heading"){ addSkip(l); continue; }
    if (l.kind === "heading"){
      closePara();
      blocks.push({kind: "heading", page: l.page, text: l.text});
      prev = null; continue;
    }
    let newPara = !para;
    if (para && prev && prev.page === l.page && prev.y > l.y){
      const gap = prev.y - l.y;
      const endsSentence = /[.!?。"”)]$/.test(prev.text);
      const indented = l.x > prev.x + l.size * 0.8 && l.x - prev.x < l.size * 4;
      if (gap > leading * 1.3 || (endsSentence && indented)) newPara = true;
    }
    if (newPara){ closePara(); para = {kind: "para", page: l.page, text: l.text}; }
    else if (/[A-Za-z]-$/.test(para.text) && /^[a-z]/.test(l.text)) para.text = para.text.slice(0, -1) + l.text;
    else para.text += " " + l.text;
    prev = l;
  }
  closePara();
  return blocks;
}

// 본문 속 출처 표시: [12], [3, 5–7], (Chen et al., 2024), (김민수 외, 2021)
const CITE_RE = new RegExp([
  /\s?\[\d+(?:\s*[,–-]\s*\d+)*\]/.source,
  /\s?\((?:(?:see |e\.g\., )?[A-Z][A-Za-z'’-]+(?: et al\.| and [A-Z][A-Za-z'’-]+| & [A-Z][A-Za-z'’-]+)?,? \d{4}[a-z]?(?:; ?)?)+\)/.source,
  /\s?\((?:[가-힣A-Za-z·]+(?:\s?외)?,\s?\d{4}[a-z]?(?:;\s?)?)+\)/.source,
].join("|"), "g");
function stripCitations(s){ return s.replace(CITE_RE, "").replace(/\s+([.,;:])/g, "$1"); }
// 화면 표시용: [{text, cite}] 조각으로 나눈다
function citeParts(s){
  const out = []; let last = 0;
  for (const m of s.matchAll(CITE_RE)){
    if (m.index > last) out.push({text: s.slice(last, m.index)});
    out.push({text: m[0], cite: true}); last = m.index + m[0].length;
  }
  if (last < s.length) out.push({text: s.slice(last)});
  return out;
}

function splitSentences(text){
  const protect = ["et al.", "Fig.", "Figs.", "Eq.", "Eqs.", "e.g.", "i.e.", "vs.", "etc.", "No.", "Sec.", "cf.", "Ref.", "Tab.", "approx."];
  let t = text.replace(/\s+/g, " ").trim();
  protect.forEach(a => { t = t.split(a).join(a.replace(/\./g, "․")); });
  return t.split(/(?<=[.!?。])\s+/).map(s => s.replace(/․/g, ".").trim()).filter(Boolean);
}


// ---- PDF 외 형식: HWP · HWPX · TXT · 엑셀 ----------------------------------
// 각 파서는 순서대로 [{text, skip?}] 조각을 돌려준다. skip은 문서 구조상 본문이
// 아닌 부분(머리말, 각주, 표 …)이며, 실제로 뺄지는 classifyParas가 옵션을 보고 정한다.

// HWP 5.0 (OLE 복합 파일). 본문은 BodyText/SectionN 스트림에 zlib(raw deflate)로 압축되어 있다.
const HWP_SKIP = {
  "head": "header", "foot": "header",          // 머리말·꼬리말
  "fn  ": "note", "en  ": "note",              // 각주·미주
  "tbl ": "table",                             // 표
  "gso ": "figure", "eqed": "figure",          // 그림·도형·수식
};
function parseHwp(buf, CFB, inflateRaw){
  const cfb = CFB.read(new Uint8Array(buf), {type: "array"});
  const header = CFB.find(cfb, "FileHeader");
  if (!header) throw new Error("한글(HWP) 문서 구조를 찾지 못했습니다.");
  const hb = Uint8Array.from(header.content);
  const flags = hb[36] | (hb[37] << 8) | (hb[38] << 16) | (hb[39] << 24);
  if (flags & 2) throw new Error("암호가 걸린 한글 문서입니다. 암호를 푼 뒤 다시 열어 주세요.");
  if (flags & 4) throw new Error("배포용(읽기 전용) 한글 문서는 열 수 없습니다. 한글에서 일반 문서로 저장해 주세요.");
  const compressed = flags & 1;

  const sections = cfb.FullPaths
    .map((path, i) => ({m: path.match(/BodyText\/Section(\d+)$/), e: cfb.FileIndex[i]}))
    .filter(x => x.m).sort((a, b) => a.m[1] - b.m[1]).map(x => x.e);
  const out = [];
  for (const sec of sections){
    let data = Uint8Array.from(sec.content);
    if (compressed) data = inflateRaw(data);
    const dv = new DataView(data.buffer, data.byteOffset, data.byteLength);
    let pos = 0, skipLevel = -1, skipKind = null, cur = null;
    const push = () => { if (cur && cur.text.trim()) out.push(cur); cur = null; };
    while (pos + 4 <= data.length){
      const h = dv.getUint32(pos, true); pos += 4;
      const tag = h & 0x3ff, level = (h >>> 10) & 0x3ff;
      let size = (h >>> 20) & 0xfff;
      if (size === 0xfff){ size = dv.getUint32(pos, true); pos += 4; }
      const body = data.subarray(pos, pos + size); pos += size;

      if (skipLevel >= 0 && level <= skipLevel){ skipLevel = -1; skipKind = null; }
      if (tag === 66){ // PARA_HEADER
        push();
        cur = {text: "", skip: skipLevel >= 0 ? skipKind : null};
      } else if (tag === 67 && cur){ // PARA_TEXT
        cur.text += hwpText(body);
      } else if (tag === 71 && skipLevel < 0 && body.length >= 4){ // CTRL_HEADER
        const id = body[3] << 24 | body[2] << 16 | body[1] << 8 | body[0];
        const name = String.fromCharCode(id >>> 24 & 255, id >>> 16 & 255, id >>> 8 & 255, id & 255);
        if (HWP_SKIP[name]){ push(); skipLevel = level; skipKind = HWP_SKIP[name]; }
      }
    }
    push();
  }
  return out;
}
function hwpText(b){
  let s = "";
  const n = b.length >> 1;
  for (let i = 0; i < n; ){
    const c = b[i * 2] | (b[i * 2 + 1] << 8);
    if (c >= 32){ s += String.fromCharCode(c); i++; continue; }
    if (c === 0 || c === 10 || c === 13 || (c >= 24 && c <= 31)){ // 한 글자짜리 제어 문자
      if (c === 10 || c === 30 || c === 31) s += " ";
      else if (c === 24) s += "-";
      i++;
    } else { // 인라인·확장 제어 문자는 8글자를 차지한다
      if (c === 9) s += " ";
      i += 8;
    }
  }
  return s;
}

// HWPX (zip + XML). Contents/sectionN.xml의 최상위 <hp:p>가 본문 문단이다.
const HWPX_SKIP = {
  header: "header", footer: "header", pageNum: "header",
  footNote: "note", endNote: "note",
  tbl: "table",
  pic: "figure", equation: "figure", container: "figure", rect: "figure", ellipse: "figure",
  line: "figure", polygon: "figure", curve: "figure", arc: "figure", textart: "figure", ole: "figure",
};
async function parseHwpx(buf, JSZip, DOMParserCtor){
  const zip = await JSZip.loadAsync(buf);
  const names = Object.keys(zip.files)
    .filter(f => /^Contents\/section\d+\.xml$/i.test(f))
    .sort((a, b) => +a.match(/\d+/)[0] - +b.match(/\d+/)[0]);
  if (!names.length) throw new Error("한글(HWPX) 문서 본문을 찾지 못했습니다.");
  const out = [];
  for (const name of names){
    const xml = await zip.file(name).async("string");
    const doc = new DOMParserCtor().parseFromString(xml, "application/xml");
    for (const p of elChildren(doc.documentElement)){
      if (p.localName !== "p") continue;
      const main = {text: ""}, extra = [];
      walkHwpx(p, main, extra, null);
      if (main.text.trim()) out.push(main);
      out.push(...extra.filter(e => e.text.trim()));
    }
  }
  return out;
}
function elChildren(el){ const a = []; for (let n = el.firstChild; n; n = n.nextSibling) if (n.nodeType === 1) a.push(n); return a; }
function walkHwpx(el, into, extra, skipKind){
  for (const c of elChildren(el)){
    const ln = c.localName;
    if (!skipKind && HWPX_SKIP[ln]){
      const part = {text: "", skip: HWPX_SKIP[ln]};
      extra.push(part);
      walkHwpx(c, part, extra, HWPX_SKIP[ln]);
    } else if (ln === "t"){
      into.text += c.textContent;
    } else if (ln === "lineBreak" || ln === "tab"){
      into.text += " ";
    } else if (ln === "p" && into.text && !/\s$/.test(into.text)){
      into.text += " ";
      walkHwpx(c, into, extra, skipKind);
    } else {
      walkHwpx(c, into, extra, skipKind);
    }
  }
}

// TXT. 인코딩(UTF-8 / UTF-16 / EUC-KR)을 추정하고, 빈 줄을 문단 경계로 본다.
function decodeText(buf){
  const b = new Uint8Array(buf);
  if (b[0] === 0xff && b[1] === 0xfe) return new TextDecoder("utf-16le").decode(b);
  if (b[0] === 0xfe && b[1] === 0xff) return new TextDecoder("utf-16be").decode(b);
  const utf8 = new TextDecoder("utf-8").decode(b);
  if (!utf8.includes("\uFFFD")) return utf8;
  try { return new TextDecoder("euc-kr").decode(b); } catch { return utf8; }
}
function parseTxt(text){
  text = text.replace(/\r\n?/g, "\n");
  // PDF에서 복사한 글에 남은 머리말: 두 번 이상 나오는 짧은 줄 (소제목 형식은 제외)
  const keyOf = t => t.toLowerCase().replace(/\d+/g, "#").replace(/\s+/g, " ").trim();
  const seen = {};
  for (const l of text.split("\n")) if (l.trim() && l.trim().length < 60) seen[keyOf(l)] = (seen[keyOf(l)] || 0) + 1;
  const isRepeat = l => seen[keyOf(l)] >= 2 && !/[.!?。]$/.test(l) && !RE_HEADING.test(l) && !RE_ABSTRACT.test(l) && !RE_PAGENUM.test(l);
  const chunks = text.split(/\n\s*\n/);
  const out = [];
  for (const chunk of chunks){
    const lines = chunk.split("\n").map(l => l.trim()).filter(Boolean);
    if (!lines.length) continue;
    const maxLen = Math.max(...lines.map(l => l.length));
    let cur = null;
    for (const l of lines){
      if (isRepeat(l)){ if (cur) out.push(cur); cur = null; out.push({text: l, skip: "header"}); continue; }
      // 한 덩어리 안에서도: 짧게 끝난 줄 뒤나, 쪽 번호·반복 머리말처럼 보이는 줄은 따로 떼어 둔다
      const standalone = l.length < 80 && (RE_PAGENUM.test(l) || RE_HEADING.test(l) || RE_REFS.test(l) || RE_ABSTRACT.test(l) || RE_CAPTION.test(l));
      if (!cur || standalone || cur.standalone || (/[.!?。"”)]$/.test(cur.text) && cur.lastLen < maxLen * 0.7)){
        if (cur) out.push(cur);
        cur = {text: l, lastLen: l.length, standalone};
      } else {
        cur.text = /[A-Za-z]-$/.test(cur.text) && /^[a-z]/.test(l) ? cur.text.slice(0, -1) + l : cur.text + " " + l;
        cur.lastLen = l.length;
      }
    }
    if (cur) out.push(cur);
  }
  return out.map(p => ({text: p.text, skip: p.skip}));
}

// 엑셀·CSV. 시트마다 제목을 두고, 첫 줄이 머리글이면 "머리글: 값" 형태로 읽는다.
function parseSheet(buf, XLSX){
  const wb = XLSX.read(new Uint8Array(buf), {type: "array"});
  const out = [];
  for (const name of wb.SheetNames){
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], {header: 1, defval: "", raw: false, blankrows: false})
      .map(r => r.map(v => String(v).trim()));
    if (!rows.length) continue;
    out.push({text: name, heading: true});
    const first = rows[0].filter(Boolean);
    const hasHeader = rows.length > 1 && first.length >= 2 && first.every(v => isNaN(+v.replace(/,/g, "")));
    const head = hasHeader ? rows[0] : null;
    for (const r of hasHeader ? rows.slice(1) : rows){
      const cells = r.map((v, i) => v && (head && head[i] ? head[i] + ": " + v : v)).filter(Boolean);
      if (cells.length) out.push({text: cells.join(", ") + ".", row: true});
    }
  }
  return out;
}

// 조각 → 블록. PDF와 같은 규칙(참고문헌, 캡션, 저자 정보, 쪽 번호, 반복 줄)을 글자만 보고 적용한다.
const SKIP_REASON = {header: "머리말·꼬리말", note: "각주·미주", table: "표", figure: "그림·도형·수식", caption: "그림·표 설명", refs: "참고문헌", front: "저자·소속"};
function classifyParas(parts, opt){
  const keyOf = t => t.toLowerCase().replace(/\d+/g, "#").replace(/\s+/g, " ").trim();
  const count = {};
  for (const p of parts) if (!p.skip && !p.row && p.text.length < 80) count[keyOf(p.text)] = (count[keyOf(p.text)] || 0) + 1;
  const absIdx = parts.findIndex((p, i) => i < 60 && !p.skip && RE_ABSTRACT.test(p.text.trim()));
  const titleIdx = parts.findIndex(p => !p.skip && p.text.trim());

  const blocks = [];
  let inRefs = false;
  parts.forEach((p, i) => {
    const t = p.text.replace(/\s+/g, " ").trim();
    if (!t) return;
    const skip = reason => {
      const last = blocks[blocks.length - 1];
      if (last && last.kind === "skip" && last.reason === reason && last.page === p.page) last.text += "\n" + t;
      else blocks.push({kind: "skip", reason, text: t, page: p.page});
    };
    if (p.row){ blocks.push({kind: "para", text: t, page: p.page}); return; }
    if (p.skip === "header") return skip(SKIP_REASON.header);
    if (p.skip === "note" && opt.small) return skip(SKIP_REASON.note);
    if (["table", "figure", "caption"].includes(p.skip) && opt.caption) return skip(SKIP_REASON[p.skip]);
    if (p.skip === "refs" && opt.refs) return skip(SKIP_REASON.refs);
    if (p.skip === "front" && opt.front) return skip(SKIP_REASON.front);
    // 종류가 이미 붙어 온 조각(글자 인식 결과)은 글자 규칙을 다시 적용하지 않는다
    if (p.heading || p.labeled){ blocks.push({kind: p.heading ? "heading" : "para", text: t, page: p.page}); return; }
    if (inRefs) return skip("참고문헌");
    if (RE_PAGENUM.test(t)) return skip("쪽 번호");
    if (t.length < 80 && count[keyOf(t)] >= 3) return skip("반복되는 줄");
    if (opt.refs && RE_REFS.test(t)){ inRefs = true; return skip("참고문헌"); }
    if (opt.front && absIdx > 0 && i < absIdx && i !== titleIdx) return skip("저자·소속");
    if (opt.caption && RE_CAPTION.test(t)) return skip("그림·표 설명");
    const short = t.length < 70 && !/[.,;:。]$/.test(t);
    const isHeading = i === titleIdx || (short && (RE_HEADING.test(t) || RE_ABSTRACT.test(t)));
    blocks.push({kind: isHeading ? "heading" : "para", text: t, page: p.page});
  });
  return blocks;
}

  : "Claude에 로그인해야 쓸 수 있어요.";

const opts = () => ({front: $("o-front").checked, small: $("o-small").checked, caption: $("o-caption").checked, refs: $("o-refs").checked});

// ---- 파일 열기 ------------------------------------------------------------
async function openFile(name, buf){
  stop();
  $("error").hidden = true;
  $("scan").hidden = true;
  state.fileName = name;
  $("file-stats").textContent = "여는 중…";
  const ext = (name.match(/\.([a-z0-9]+)$/i)?.[1] || "").toLowerCase();
  try {
    if (ext === "pdf"){
      await need("pdf");
      const pdf = await pdfjsLib.getDocument({data: new Uint8Array(buf), isEvalSupported: false}).promise;
      const lines = await extractLines(pdf, (p, n) => { $("file-stats").textContent = `글자 읽는 중… ${p}/${n}쪽`; });
      state.source = {type: "pdf", lines, pages: pdf.numPages, pdf};
    } else if (ext === "hwp"){
      await need("xlsx", "pako");
      state.source = {type: "parts", parts: parseHwp(buf, XLSX.CFB, d => pako.inflateRaw(d))};
    } else if (ext === "hwpx"){
      await need("jszip");
      state.source = {type: "parts", parts: await parseHwpx(buf, JSZip, DOMParser)};
    } else if (["xlsx", "xls", "csv", "xlsm", "ods"].includes(ext)){
      await need("xlsx");
      state.source = {type: "parts", parts: parseSheet(buf, XLSX), sheet: true};
    } else if (ext === "txt" || ext === "md" || ext === ""){
      state.source = {type: "parts", parts: parseTxt(decodeText(buf))};
    } else {
      throw new Error("지원하지 않는 형식입니다. PDF, 한글, 엑셀, TXT 파일을 열어 주세요.");
    }
    state.translations.clear(); state.pending.clear();
    ocrAbort?.abort();
    state.idx = 0;
    rebuild();
    checkScan();
  } catch (e){
    $("file-stats").textContent = "";
    $("error").textContent = e.message || "파일을 여는 중 문제가 생겼습니다.";
    $("error").hidden = false;
  }
}

$("file").addEventListener("change", async e => {
  const f = e.target.files[0]; if (!f) return;
  openFile(f.name, await f.arrayBuffer());
  e.target.value = "";
});
$("file-btn").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); $("file").click(); } });
const drop = document.body;
["dragenter", "dragover"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add("drag"); }));
["dragleave", "drop"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove("drag"); }));
drop.addEventListener("drop", async e => {
  const f = e.dataTransfer.files[0]; if (f) openFile(f.name, await f.arrayBuffer());
});
$("ex-en").addEventListener("click", () => openFile("예시 논문 (영어).pdf", Uint8Array.from(atob(SAMPLE_PDF_B64), c => c.charCodeAt(0)).buffer));
$("ex-ko").addEventListener("click", () => openFile("예시 논문 (한국어).txt", new TextEncoder().encode(SAMPLE_TXT).buffer));

// ---- 분류 → 문장 ----------------------------------------------------------
function rebuild(){
  if (!state.source) return;
  stop();
  const o = opts();
  if (state.source.type === "pdf" && !state.source.ocrParts){
    classify(state.source.lines, o);
    state.blocks = buildBlocks(state.source.lines);
  } else {
    state.blocks = classifyParas(state.source.ocrParts || state.source.parts, o);
  }
  // 문서 언어: 한글 비율로 추정
  const sample = state.blocks.filter(b => b.kind !== "skip").map(b => b.text).join(" ").slice(0, 4000);
  const ko = (sample.match(/[가-힣]/g) || []).length, en = (sample.match(/[A-Za-z]/g) || []).length;
  state.lang = ko > en * 0.3 ? "ko" : "en";

  state.sentences = [];
  state.blocks.forEach(b => {
    if (b.kind === "skip") return;
    b.first = state.sentences.length;
    const parts = b.kind === "heading" ? [b.text] : splitSentences(b.text);
    for (const t of parts) state.sentences.push({text: t, block: b});
  });
  state.idx = Math.min(state.idx, Math.max(0, state.sentences.length - 1));
  const skipped = state.blocks.filter(b => b.kind === "skip");
  const reasons = [...new Set(skipped.map(b => b.reason))];
  $("file-stats").textContent = "";
  state.statsText = `${state.lang === "ko" ? "한국어" : "영어"} · 읽을 문장 ${state.sentences.length}개` +
    (skipped.length ? ` · 뺀 부분: ${reasons.join(", ")}` : "");
  updateModeUi();
  loadVoices();
  render();
}
["o-front", "o-small", "o-caption", "o-refs"].forEach(id => $(id).addEventListener("change", () => { updateSummaries(); rebuild(); }));
$("o-show").addEventListener("change", () => { stop(); render(); });

const speakText = s => (state.stripCites ? stripCitations(s.text) : s.text).trim();

// ---- 화면 ----------------------------------------------------------------
function sentenceEl(i){
  const s = state.sentences[i];
  const span = document.createElement("span");
  span.className = "s"; span.dataset.i = i;
  for (const p of citeParts(s.text)){
    if (p.cite){ const c = document.createElement("span"); c.className = "cite"; c.textContent = p.text; span.appendChild(c); }
    else span.appendChild(document.createTextNode(p.text));
  }
  span.addEventListener("click", () => { stop(); state.idx = i; play(); });
  return span;
}
function render(){
  const doc = $("doc");
  doc.innerHTML = "";
  doc.classList.toggle("strip", state.stripCites);
  doc.classList.toggle("hide-skips", !$("o-show").checked);
  const bi = state.bilingual && state.lang === "en";
  let lastPage = null, seenTitle = false;
  for (const b of state.blocks){
    if (b.page && b.page !== lastPage && (b.kind !== "skip" || $("o-show").checked)){
      if (lastPage !== null){ const pg = document.createElement("span"); pg.className = "pg"; pg.textContent = `p. ${b.page}`; doc.appendChild(pg); }
      lastPage = b.page;
    }
    if (b.kind === "skip"){
      const d = document.createElement("div"); d.className = "skip";
      const why = document.createElement("span"); why.className = "why"; why.textContent = b.reason;
      d.append(why, document.createTextNode(b.text));
      doc.appendChild(d); continue;
    }
    const el = document.createElement(b.kind === "heading" ? "div" : "p");
    if (b.kind === "heading"){ el.className = "h" + (!seenTitle ? " title" : ""); seenTitle = true; }
    const end = b.first + (b.kind === "heading" ? 1 : splitSentences(b.text).length);
    for (let i = b.first; i < end; i++){
      if (bi){
        const pair = document.createElement("span"); pair.className = "pair";
        const tr = document.createElement("span"); tr.className = "tr"; tr.dataset.tr = i;
        pair.append(sentenceEl(i), tr); el.appendChild(pair);
      } else {
        el.appendChild(sentenceEl(i)); el.appendChild(document.createTextNode(" "));
      }
    }
    doc.appendChild(el);
  }
  if (!state.sentences.length){
    const p = document.createElement("p"); p.className = "empty";
    p.textContent = "읽을 본문을 찾지 못했습니다. ‘빼고 읽을 부분’ 선택을 줄여 보세요.";
    doc.appendChild(p);
  }
  if (bi) state.sentences.forEach((_, i) => showTranslation(i));
  fillJump();
  mark();
}
// 시작 위치 목록: 처음 + 소제목마다
function fillJump(){
  const sel = $("jump");
  sel.innerHTML = "";
  const add = (value, label) => { const o = document.createElement("option"); o.value = value; o.textContent = label; sel.appendChild(o); };
  add(0, "처음부터");
  for (const b of state.blocks){
    if (b.kind !== "heading" || b.first === 0) continue;
    add(b.first, (b.page ? `p.${b.page} · ` : "") + (b.text.length > 40 ? b.text.slice(0, 40) + "…" : b.text));
  }
  add(-1, "직접 고른 문장");
  sel.lastChild.hidden = true;
}
function syncJump(){
  const sel = $("jump");
  let v = "0";
  for (const o of sel.options) if (+o.value >= 0 && +o.value <= state.idx) v = o.value;
  const exact = [...sel.options].some(o => +o.value === state.idx);
  sel.value = !state.playing && !exact && state.idx > 0 ? "-1" : v;
}
$("jump").addEventListener("change", e => {
  const v = +e.target.value; if (v < 0) return;
  const wasPlaying = state.playing;
  stop();
  state.idx = v;
  if (wasPlaying) play();
  else { mark(); document.querySelector(".s.start")?.scrollIntoView({block: "center", behavior: "smooth"}); }
});

function mark(){
  document.querySelectorAll(".s").forEach(el => {
    const i = +el.dataset.i;
    el.classList.toggle("start", !state.playing && state.idx > 0 && i === state.idx);
    el.classList.toggle("now", state.playing && i === state.idx);
    el.classList.toggle("read", i < state.idx);
  });
  const now = document.querySelector(".s.now");
  if (now) now.scrollIntoView({block: "center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
  syncJump();
  $("status").textContent = state.sentences.length ? `${Math.min(state.idx + 1, state.sentences.length)}/${state.sentences.length}` : "";
}

// ---- 설정 버튼 ------------------------------------------------------------
function seg(onId, offId, on){ $(onId).setAttribute("aria-pressed", on); $(offId).setAttribute("aria-pressed", !on); updateSummaries(); }
function updateSummaries(){
  $("tip-file").dataset.tip = (state.fileName ? `지금 파일: ${state.fileName}\n${state.statsText || ""}\n\n` : "") +
    "PDF · 한글(HWP, HWPX) · 엑셀(XLSX, XLS, CSV) · TXT 파일을 엽니다. 화면에 끌어다 놓아도 됩니다.";
  $("sum-cite").textContent = state.stripCites ? "빼고" : "다 읽기";
  $("sum-mode").textContent = claudeState === "off" ? "안 됨" : state.bilingual && state.lang === "en" && sampleFn ? "켬" : "끔";
  $("sum-skip").textContent = ["o-front", "o-small", "o-caption", "o-refs"].filter(id => $(id).checked).length + "개";
}
// 드롭다운: 하나만 열고, 바깥을 누르거나 항목을 고르면 닫는다
const dds = [...document.querySelectorAll(".dd")];
dds.forEach(d => d.addEventListener("toggle", () => { if (d.open) dds.forEach(o => { if (o !== d) o.open = false; }); }));
document.addEventListener("click", e => { if (!e.target.closest(".dd")) dds.forEach(d => d.open = false); });
document.addEventListener("keydown", e => { if (e.key === "Escape") dds.forEach(d => d.open = false); });
document.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => { b.closest(".dd").open = false; }));
$("cite-strip").addEventListener("click", () => { state.stripCites = true; seg("cite-strip", "cite-keep", true); state.translations.clear(); stop(); render(); });
$("cite-keep").addEventListener("click", () => { state.stripCites = false; seg("cite-strip", "cite-keep", false); state.translations.clear(); stop(); render(); });
$("mode-orig").addEventListener("click", () => { state.bilingual = false; updateModeUi(); stop(); render(); });
$("mode-bi").addEventListener("click", () => { state.bilingual = true; updateModeUi(); stop(); render(); translateFrom(state.idx); });
function updateModeUi(){
  queueMicrotask(updateSummaries);
  const isEn = state.lang === "en";
  const off = claudeState === "off";
  $("dd-mode").classList.toggle("off", off);
  $("mode-off").hidden = !off;
  if (off) $("mode-off").innerHTML = offReason() + (EDITION === "web" ? ` <a href="${CLAUDE_URL}" target="_blank" rel="noopener">claude.ai 버전 열기</a>` : "");
  $("mode-orig").disabled = $("mode-bi").disabled = !isEn || !sampleFn;
  seg("mode-bi", "mode-orig", state.bilingual && isEn && !!sampleFn);
  $("voice-ko-wrap").hidden = !(state.bilingual && isEn && sampleFn);
  $("tip-mode").dataset.tip = off ? "번역: " + offReason()
    : !sampleFn ? "번역 기능을 확인하는 중입니다."
    : !isEn ? "지금 문서는 한국어라 번역 없이 읽습니다."
    : "영어 한 문장을 읽고, 이어서 그 문장의 번역을 읽습니다. 번역에는 Claude 사용량이 조금 쓰입니다.";
}

// ---- 번역 (claude.ai 안에서만) ---------------------------------------------
const BATCH = 20;
function showTranslation(i){
  const el = document.querySelector(`[data-tr="${i}"]`); if (!el) return;
  const t = state.translations.get(speakText(state.sentences[i]));
  el.textContent = t || "번역 대기 중…";
  el.classList.toggle("wait", !t);
}
function translateFrom(start){
  if (!sampleFn || !state.bilingual || state.lang !== "en") return Promise.resolve();
  const b = Math.floor(start / BATCH);
  if (state.pending.has(b)) return state.pending.get(b);
  const idxs = [];
  for (let i = b * BATCH; i < Math.min((b + 1) * BATCH, state.sentences.length); i++){
    if (!state.translations.has(speakText(state.sentences[i]))) idxs.push(i);
  }
  if (!idxs.length) return Promise.resolve();
  idxs.forEach(i => { const el = document.querySelector(`[data-tr="${i}"]`); if (el) el.textContent = "번역 중…"; });
  const src = idxs.map(i => speakText(state.sentences[i]));
  const prompt = "다음은 영어 학술 논문의 문장들입니다. 각 문장을 자연스러운 한국어로 번역하세요. " +
    "전문 용어는 정확하게, 숫자와 기호는 그대로 두고, 소리 내어 읽기 좋은 문장으로 옮기세요. " +
    "입력과 같은 순서·같은 개수의 JSON 문자열 배열로만 답하세요. 예: [\"첫 문장 번역\", \"둘째 문장 번역\"]\n\n" +
    JSON.stringify(src);
  const p = sampleFn.json(prompt, {modelTier: "quick", cache: {gcTime: 86400000}})
    .then(arr => {
      if (Array.isArray(arr)) src.forEach((s, k) => { if (typeof arr[k] === "string" && arr[k].trim()) state.translations.set(s, arr[k].trim()); });
      idxs.forEach(showTranslation);
    })
    .catch(e => {
      idxs.forEach(i => { const el = document.querySelector(`[data-tr="${i}"]`); if (el) el.textContent = ""; });
      const hide = ["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"];
      if (hide.includes(e?.code)){ sampleFn = null; claudeState = "off"; state.bilingual = false; updateModeUi(); }
      $("error").textContent = e?.code === "rate_limited" ? "번역 요청이 많아 잠시 멈췄습니다. 조금 뒤에 다시 눌러 주세요."
        : hide.includes(e?.code) ? "번역을 쓸 수 없어 원문만 읽습니다."
        : "번역하지 못한 문장이 있습니다. 해당 문장은 원문만 읽습니다.";
      $("error").hidden = false;
    })
    .finally(() => state.pending.delete(b));
  state.pending.set(b, p);
  return p;
}

// ---- 스캔 PDF: Claude로 글자 인식 (claude.ai 안에서만) --------------------------
let ocrAbort = null;
function checkScan(){
  const src = state.source;
  if (!src || src.type !== "pdf" || src.ocrParts) return;
  const chars = new Array(src.pages + 1).fill(0);
  for (const l of src.lines) if (!["header", "pagenum", "margin"].includes(l.kind)) chars[l.page] += l.text.length;
  const empty = chars.slice(1).filter(c => c < 80).length;
  if (empty < Math.max(1, src.pages * 0.5)) return;
  $("scan").hidden = false;
  const off = claudeState === "off";
  const emptyMsg = document.querySelector("#doc .empty");
  if (emptyMsg) emptyMsg.textContent = "스캔한 이미지라 읽을 글자가 없습니다.";
  $("scan-msg").textContent = `스캔본 PDF라 ${src.pages}쪽 중 ${empty}쪽에 글자가 없어 읽을 수 없습니다.` + (off ? " 글자 인식은 " + offReason() : "");
  $("ocr").hidden = !sampleFn;
  $("ocr-elsewhere").hidden = !(off && EDITION === "web");
  $("ocr-elsewhere").href = CLAUDE_URL;
  $("ocr-status").textContent = !off && !sampleFn ? "글자 인식 기능을 확인하는 중…" : "";
  if (sampleFn) sampleFn.limits().then(l => { if (!l?.images){ $("ocr").hidden = true; $("ocr-status").textContent = "이 화면에서는 이미지를 Claude에게 보낼 수 없어 글자 인식을 쓸 수 없습니다."; } }).catch(() => {});
}
const OCR_PROMPT = `이 이미지는 학술 논문 PDF의 한 쪽을 스캔한 것입니다. 글자를 원문 언어 그대로 옮겨 적고, 덩어리마다 종류를 붙이세요.
종류: "heading"(논문 제목·소제목), "body"(본문 문단), "front"(저자·소속·학술지 정보), "header"(머리말·꼬리말·쪽 번호·다운로드/저작권 안내 문구), "footnote"(각주), "caption"(그림·표 안의 글자와 설명), "references"(참고문헌 목록).
규칙: 읽는 순서대로(2단 편집이면 왼쪽 단 먼저), 문단 하나를 덩어리 하나로, 줄 끝 하이픈으로 나뉜 단어는 이어 붙이고, 고치거나 요약하지 말 것.
JSON 배열로만 답하세요. 예: [{"type":"heading","text":"1. Introduction"},{"type":"body","text":"..."}]
글자가 없는 쪽이면 [] 로 답하세요.`;
const OCR_KIND = {front: "front", header: "header", footnote: "note", caption: "caption", references: "refs"};
async function runOcr(){
  const src = state.source;
  if (!src?.pdf || !sampleFn) return;
  if (ocrAbort){ ocrAbort.abort(); return; }
  ocrAbort = new AbortController();
  const signal = ocrAbort.signal;
  $("ocr").textContent = "멈추기";
  src.ocrParts = [];
  let failed = 0;
  try {
    for (let p = 1; p <= src.pages && !signal.aborted; p++){
      $("ocr-status").textContent = `글자 인식 중… ${p}/${src.pages}쪽`;
      const page = await src.pdf.getPage(p);
      const vp1 = page.getViewport({scale: 1});
      const vp = page.getViewport({scale: Math.min(2.5, 1600 / Math.max(vp1.width, vp1.height))});
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(vp.width); canvas.height = Math.round(vp.height);
      await page.render({canvasContext: canvas.getContext("2d"), viewport: vp}).promise;
      const blob = await new Promise(r => canvas.toBlob(r, "image/jpeg", 0.85));
      try {
        const arr = await sampleFn.json(OCR_PROMPT, {images: blob, signal, cache: {gcTime: 86400000}});
        for (const it of Array.isArray(arr) ? arr : []){
          const text = String(it?.text || "").trim(); if (!text) continue;
          src.ocrParts.push({text, page: p, heading: it.type === "heading", skip: OCR_KIND[it.type] || null, labeled: true});
        }
      } catch (e){
        if (e?.code === "cancelled") break;
        if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed", "images_unavailable"].includes(e?.code)){
          $("ocr-status").textContent = "Claude를 쓸 수 없어 글자 인식을 멈췄습니다."; break;
        }
        if (e?.code === "rate_limited"){ $("ocr-status").textContent = `요청이 많아 ${p - 1}쪽까지 인식하고 멈췄습니다. 잠시 뒤 다시 눌러 주세요.`; break; }
        failed++;
      }
      if (!state.playing) rebuild();
    }
  } finally {
    ocrAbort = null;
    $("ocr").textContent = "다시 인식하기";
    if (src.ocrParts.length) $("scan-msg").textContent = "스캔본이라 Claude가 인식한 글자로 읽습니다.";
    if (!/멈췄/.test($("ocr-status").textContent)){
      $("ocr-status").textContent = signal.aborted ? "글자 인식을 멈췄습니다." : failed ? `인식 완료 (${failed}쪽은 인식하지 못했습니다)` : "글자 인식 완료";
    }
    if (!state.playing) rebuild(); else state.rebuildLater = true;
  }
}
$("ocr").addEventListener("click", runOcr);

// ---- 음성 ----------------------------------------------------------------
const isGood = v => /google|natural|online|neural|premium|enhanced|siri|yuna|samantha/i.test(v.name);
function fillVoices(sel, lang){
  const all = synth.getVoices();
  const prev = sel.value;
  const list = all.filter(v => v.lang.toLowerCase().startsWith(lang)).sort((a, b) => isGood(b) - isGood(a));
  sel.innerHTML = "";
  for (const v of list.length ? list : all){
    const o = document.createElement("option");
    o.value = v.name; o.textContent = (isGood(v) ? "★ " : "") + v.name + " (" + v.lang + ")";
    sel.appendChild(o);
  }
  if ([...sel.options].some(o => o.value === prev)) sel.value = prev;
  return list.length;
}
function loadVoices(){
  if (!synth) return;
  const n = fillVoices($("voice-src"), state.lang);
  fillVoices($("voice-ko"), "ko");
  $("voice-src-l").textContent = state.lang === "ko" ? "한국어 원문" : "영어 원문";
  if (synth.getVoices().length && !n){ $("error").textContent = `이 기기에 ${state.lang === "ko" ? "한국어" : "영어"} 음성이 없어 다른 음성으로 읽습니다.`; $("error").hidden = false; }
}
function utter(text, sel, fallbackLang){
  const u = new SpeechSynthesisUtterance(text);
  const v = synth.getVoices().find(v => v.name === $(sel).value);
  if (v){ u.voice = v; u.lang = v.lang; } else u.lang = fallbackLang;
  u.rate = +$("rate").value;
  return u;
}

// ---- 재생 ----------------------------------------------------------------
function step(){
  if (!state.playing) return;
  if (state.idx >= state.sentences.length){ finish(); return; }
  const s = state.sentences[state.idx];
  const bi = state.bilingual && state.lang === "en" && sampleFn;
  mark();
  if (bi){ translateFrom(state.idx); translateFrom(state.idx + BATCH / 2); }
  const text = speakText(s);
  if (!text){ state.idx++; return step(); }
  const u = utter(text, "voice-src", state.lang === "ko" ? "ko-KR" : "en-US");
  u.onend = async () => {
    if (!state.playing) return;
    if (bi){
      await translateFrom(state.idx);
      if (!state.playing) return;
      const t = state.translations.get(text);
      if (t){
        const k = utter(t, "voice-ko", "ko-KR");
        k.onend = () => { if (state.playing){ state.idx++; step(); } };
        k.onerror = onErr;
        synth.speak(k);
        return;
      }
    }
    state.idx++; step();
  };
  u.onerror = onErr;
  synth.speak(u);
}
function onErr(e){ if (e.error !== "interrupted" && e.error !== "canceled"){ $("error").textContent = "읽는 중 문제가 생겼습니다: " + e.error; $("error").hidden = false; finish(); } }
async function play(){
  if (!synth || !state.sentences.length) return;
  if (state.idx >= state.sentences.length) state.idx = 0;
  synth.cancel();
  state.playing = true; state.paused = false;
  $("play").disabled = true; $("pause").disabled = false; $("stop").disabled = false;
  $("pause").textContent = "❚❚"; $("pause").setAttribute("aria-label", "일시정지");
  try { wakeLock = await navigator.wakeLock?.request("screen"); } catch {}
  step();
}
function finish(){
  state.playing = false; state.paused = false;
  if (state.rebuildLater){ state.rebuildLater = false; setTimeout(rebuild); }
  $("play").disabled = false; $("pause").disabled = true; $("stop").disabled = true;
  $("play").textContent = state.idx >= state.sentences.length ? "▶ 다시" : "▶ 읽기";
  if (state.idx >= state.sentences.length) state.idx = 0;
  wakeLock?.release?.().catch(() => {}); wakeLock = null;
  mark();
}
function stop(){ if (!state.playing && !state.paused) return; state.playing = false; synth?.cancel(); finish(); }
$("play").addEventListener("click", play);
$("stop").addEventListener("click", () => { stop(); state.idx = 0; $("play").textContent = "▶ 읽기"; mark(); });
$("pause").addEventListener("click", () => {
  if (!state.paused){ synth.pause(); state.paused = true; $("pause").textContent = "▶"; $("pause").setAttribute("aria-label", "계속"); }
  else { synth.resume(); state.paused = false; $("pause").textContent = "❚❚"; $("pause").setAttribute("aria-label", "일시정지"); }
});

// ---- 시작 ----------------------------------------------------------------
if (!synth){
  $("error").textContent = "이 브라우저는 음성 읽기를 지원하지 않습니다. Chrome, Edge, Safari에서 열어 주세요.";
  $("error").hidden = false; $("play").disabled = true;
} else {
  synth.addEventListener ? synth.addEventListener("voiceschanged", loadVoices) : (synth.onvoiceschanged = loadVoices);
  window.addEventListener("pagehide", () => synth.cancel());
}
updateModeUi();
$("ex-en").click();
if (claudeState === "pending"){
  const settle = fn => { sampleFn = fn || null; claudeState = fn ? "on" : "off"; updateModeUi(); if (state.bilingual) render(); checkScan(); };
  window.claude.use("sample").then(settle).catch(() => settle(null));
}
</script>

</body>
</html>
