{ const m=new T.MeshStandardMaterial({color:'#7fc0e6',roughness:0.4}); D.streams.forEach(st=>{ const pos=[],idx=[]; let n=0; for(let i=0;i<st.length-1;i++){ const [x1,z1]=st[i],[x2,z2]=st[i+1]; const dx=x2-x1,dz=z2-z1,L=Math.hypot(dx,dz)||1,nx=-dz/L*6,nz=dx/L*6; pos.push(x1+nx,1.2,z1+nz,x1-nx,1.2,z1-nz,x2+nx,1.2,z2+nz,x2-nx,1.2,z2-nz); idx.push(n,n+2,n+1,n+1,n+2,n+3); n+=4; } const g=new T.BufferGeometry(); g.setAttribute('position',new T.Float32BufferAttribute(pos,3)); g.setIndex(idx); g.computeVertexNormals(); scene.add(new T.Mesh(g,m)); }); }

// 구름
{ const ct=canvasTex(256,256,(g,w,h)=>{ for(let i=0;i<26;i++){ const x=40+Math.random()*176, y=90+Math.random()*90-(Math.abs(x-128)<60?30:0), r=26+Math.random()*34; const gr=g.createRadialGradient(x,y-r*0.3,r*0.1,x,y,r); gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(0.7,'rgba(246,249,252,.95)'); gr.addColorStop(1,'rgba(230,238,246,0)'); g.fillStyle=gr; g.beginPath(); g.arc(x,y,r,0,7); g.fill(); } });
  for(let i=0;i<90;i++){ const sp=new T.Sprite(new T.SpriteMaterial({map:ct,transparent:true,depthWrite:false})); const sc=500+rnd()*900; sp.scale.set(sc*1.6,sc,1); sp.position.set(X0-4000+rnd()*(X1-X0+8000), 900+rnd()*900, Z0-6000+rnd()*(Z1-Z0+12000)); scene.add(sp);} }
// 돔
const domeG=new T.Group(); { const g=domeG; const floor=new T.Mesh(new T.CylinderGeometry(6.1,6.25,0.4,56),new T.MeshStandardMaterial({color:'#efe7da'})); g.add(floor);
  const gf=new T.Mesh(new T.RingGeometry(6.1,8.8,72),new T.MeshStandardMaterial({color:'#d9f0ff',transparent:true,opacity:0.14,side:T.DoubleSide,depthWrite:false})); gf.rotation.x=-Math.PI/2; gf.position.y=0.2; g.add(gf);
  const glass=new T.Mesh(new T.SphereGeometry(8.5,64,32,0,Math.PI*2,0,Math.PI/2),new T.MeshPhysicalMaterial({color:'#ffffff',transparent:true,opacity:0.08,roughness:0,side:T.DoubleSide,depthWrite:false})); g.add(glass);
  const under=new T.Mesh(new T.SphereGeometry(6.2,40,16,0,Math.PI*2,Math.PI/2,Math.PI/2),new T.MeshStandardMaterial({color:'#e9e3d6'})); under.scale.y=0.22; under.position.y=-0.2; g.add(under);
  const cush=new T.MeshStandardMaterial({color:'#e2d8c6'}); for(let k=0;k<18;k++){ const a=k/18*6.283; const c=new T.Mesh(new T.CylinderGeometry(0.42,0.46,0.12,20),cush); c.position.set(Math.cos(a)*5.15,0.26,Math.sin(a)*5.15); g.add(c);} scene.add(g); }
// 길 위 위치 (0~1)
const P=D.path; const segL=[]; let tot=0; for(let i=0;i<P.length-1;i++){ const l=Math.hypot(P[i+1][0]-P[i][0],P[i+1][1]-P[i][1]); segL.push(l); tot+=l; }
function along(u){ let d=u*tot; for(let i=0;i<segL.length;i++){ if(d<=segL[i]){ const t=d/segL[i]; return [P[i][0]+(P[i+1][0]-P[i][0])*t, P[i][1]+(P[i+1][1]-P[i][1])*t, Math.atan2(P[i+1][1]-P[i][1],P[i+1][0]-P[i][0])]; } d-=segL[i]; } const n=P.length-1; return [P[n][0],P[n][1],0]; }
window.totalLen=tot;
const P2=D.path2; const segL2=[]; let tot2=0; for(let i=0;i<P2.length-1;i++){ const l=Math.hypot(P2[i+1][0]-P2[i][0],P2[i+1][1]-P2[i][1]); segL2.push(l); tot2+=l; }
function along2(u){ let d=u*tot2; for(let i=0;i<segL2.length;i++){ if(d<=segL2[i]){ const t=d/segL2[i]; return [P2[i][0]+(P2[i+1][0]-P2[i][0])*t, P2[i][1]+(P2[i+1][1]-P2[i][1])*t, Math.atan2(P2[i+1][1]-P2[i][1],P2[i+1][0]-P2[i][0])]; } d-=segL2[i]; } return [P2[0][0],P2[0][1],0]; }
window.totalLen2=tot2;
// 지도 보기용: 돔이 다니는 길 표시
const routeLine=new T.Mesh(new T.TubeGeometry(new T.CatmullRomCurve3(P.map(p=>new T.Vector3(p[0],30,p[1]))),200,45,8,false),new T.MeshBasicMaterial({color:'#ff6fa3'})); routeLine.visible=false; scene.add(routeLine);
const routeLine2=new T.Mesh(new T.TubeGeometry(new T.CatmullRomCurve3(P2.map(p=>new T.Vector3(p[0],30,p[1])),true),200,40,8,true),new T.MeshBasicMaterial({color:'#ff9f1a'})); routeLine2.visible=false; scene.add(routeLine2);
const markers=[]; [[P[0],'#ff3b7a'],[P[P.length-1],'#ff3b7a']].forEach(([p,c])=>{ const mk=new T.Mesh(new T.SphereGeometry(120,20,14),new T.MeshBasicMaterial({color:c})); mk.position.set(p[0],60,p[1]); mk.visible=false; scene.add(mk); markers.push(mk); });
const FOG=scene.fog;
window.shot=(v)=>{ const [x,z,a]=v.route===2?along2(v.u):along(v.u); const y=v.alt||140; domeG.position.set(x,y,z);
  if(v.mode==='in'){ const ang=(v.dir||0)+a; cam.fov=v.fov||78; cam.position.set(x+Math.cos(ang)*5.2,y+1.2,z+Math.sin(ang)*5.2); cam.lookAt(x+Math.cos(ang)*1000,y-(v.down||220),z+Math.sin(ang)*1000); }
  else if(v.mode==='free'){ cam.fov=v.fov||60; const a0=L[v.at]; cam.position.set(a0[0]+v.off[0],v.off[1],a0[1]+v.off[2]); cam.lookAt(a0[0]+(v.look||[0,0,0])[0],(v.look||[0,0,0])[1],a0[1]+(v.look||[0,0,0])[2]); domeG.position.set(a0[0]+(v.dome||[0,140,200])[0],(v.dome||[0,140,200])[1],a0[1]+(v.dome||[0,140,200])[2]); }
  else if(v.mode==='map'){ cam.fov=50; cam.position.set(-500,19000,9000); cam.lookAt(-500,0,-2200); }
  else { const ang=a+(v.dir||2.4); cam.fov=v.fov||60; cam.position.set(x+Math.cos(ang)*(v.dist||60),y+(v.h||25),z+Math.sin(ang)*(v.dist||60)); cam.lookAt(x,y-10,z); }
  const isMap=v.mode==='map'; scene.fog=isMap?null:FOG; routeLine.visible=isMap; routeLine2.visible=isMap; markers.forEach(m=>m.visible=isMap); domeG.visible=!isMap;
  cam.updateProjectionMatrix(); R.render(scene,cam); return R.domElement.toDataURL('image/jpeg',0.92); };
window.ready=true;
