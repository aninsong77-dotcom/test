<script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const W=innerWidth,H=innerHeight;

 vertexShader:'varying vec3 vD; void main(){ vD=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }',
 fragmentShader:`varying vec3 vD; uniform vec3 uSun; void main(){ vec3 d=normalize(vD); float h=clamp(d.y,0.,1.);

{ // 나무

{ const cols=['#ffffff','#1f1f1f','#c0c4c8','#2f5aa8','#b83232','#e3e3e3','#3d3d3d']; const c=new T.Color(); let i=0;

// 구름: 뭉게구름
{ const ct=canvasTex(256,256,(g,w,h)=>{ for(let i=0;i<26;i++){ const x=40+Math.random()*176, y=90+Math.random()*90-(Math.abs(x-128)<60?30:0), r=26+Math.random()*34; const gr=g.createRadialGradient(x,y-r*0.3,r*0.1,x,y,r); gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(0.7,'rgba(246,249,252,.95)'); gr.addColorStop(1,'rgba(230,238,246,0)'); g.fillStyle=gr; g.beginPath(); g.arc(x,y,r,0,7); g.fill(); }

// 움직임 (몇 초 진행해서 찍기)
const m4=new T.Matrix4();
function step(t){ cars.forEach((c,i)=>{ if(i>=carMesh.count) return; let x=c.x,z=c.z,y=c.y||0.75+0.45; if(c.ax==='x'){ x=((c.x+c.dir*c.sp*t+1600)%3200+3200)%3200-1600; m4.makeRotationY(0);} else { const L=RIVER_Z1-RIVER_Z0+60; z=RIVER_Z0-30+(((c.z-RIVER_Z0+30)+c.dir*c.sp*t)%L+L)%L; m4.makeRotationY(Math.PI/2); y=c.y+0.75; } m4.setPosition(x,y,z); carMesh.setMatrixAt(i,m4); }); carMesh.instanceMatrix.needsUpdate=true;
  boats.forEach(b=>{ b.g.position.x+=b.dir*b.sp*0.0; }); }
window.shot=(view)=>{ step(view.t||0);
  const [px,py,pz]=view.pos, [lx,ly,lz]=view.look; cam.fov=view.fov||70; cam.position.set(DOME.x+px,DOME.y+py,DOME.z+pz); cam.lookAt(DOME.x+lx,DOME.y+ly,DOME.z+lz); cam.updateProjectionMatrix();
  R.render(scene,cam); return R.domElement.toDataURL('image/jpeg',0.92); };
window.ready=true;
</script></body></html>
